name: Web P0 Authorize NVIDIA Ultra Free Self-Test

on:
  push:
    branches:
      - main
    paths:
      - '.airlab/deploy/nemotron-ultra-selftest-request.json'

permissions:
  contents: read

concurrency:
  group: web-private-production
  cancel-in-progress: false

jobs:
  authorize-ultra-self-test:
    name: Verify and authorize NVIDIA Ultra prototype route
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: web-private-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
    steps:
      - name: Checkout authorized change request
        uses: actions/checkout@v6
      - name: Verify exact route and apply minimal server-side flag
        shell: bash
        run: |
          set -euo pipefail
          node scripts/airlab/web_p0_authorize_nemotron_ultra.mjs
