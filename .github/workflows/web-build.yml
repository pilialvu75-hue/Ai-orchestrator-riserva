name: Web Cantiere Build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  web-cantiere:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile --enforce-lockfile

      - name: Analyze Web entrypoint
        run: |
          flutter analyze --no-fatal-warnings --no-fatal-infos \
            lib/web_main.dart \
            lib/app_factory/workshop/workshop_checkpoint_store.dart \
            lib/app_factory/workshop/workshop_persistent_checkpoint_store.dart \
            lib/app_factory/workshop/web/workshop_web_checkpoint_storage.dart \
            lib/app_factory/workshop/web/workshop_web_cloud_broker.dart \
            lib/app_factory/workshop/web/workshop_web_shell.dart \
            test/app_factory/workshop/web/workshop_web_shell_test.dart \
            test/app_factory/workshop/web/workshop_web_checkpoint_storage_test.dart \
            test/app_factory/workshop/web/workshop_web_cloud_broker_test.dart \
            test/app_factory/workshop/web/workshop_web_cloud_broker_contract_test.dart

      - name: Run Web contract tests on VM
        run: flutter test test/app_factory/workshop/web/

      - name: Run browser adapters in Chrome
        run: |
          flutter test --platform chrome test/app_factory/workshop/web/workshop_web_checkpoint_storage_test.dart
          flutter test --platform chrome test/app_factory/workshop/web/workshop_web_cloud_broker_test.dart

      - name: Validate Cloudflare Function module syntax
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module --check < functions/api/cantiere/capabilities.js
          node --input-type=module --check < functions/api/cantiere/inference.js

      - name: Build ordinary Cantiere Web application
        run: flutter build web --release --target lib/web_main.dart

      - name: Assert no PWA manifest was introduced in W1
        shell: bash
        run: |
          set -euo pipefail
          test ! -f web/manifest.json
          test -s build/web/index.html
          test -s build/web/main.dart.js
