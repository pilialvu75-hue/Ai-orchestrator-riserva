name: SDK Manager Fix Experiment

on:
  push:
    branches:
      - codex/fix-sdkmanager-version
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: sdkmanager-fix-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  fix:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[sdkmanager-fix]')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v6
        with:
          ref: codex/fix-sdkmanager-version
          fetch-depth: 0

      - name: Apply surgical sdkmanager fix
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/build.yml')
          text = path.read_text()

          old_setup = (
              "      - name: Setup Android SDK\n"
              "        uses: android-actions/setup-android@v4\n"
              "\n"
          )
          if text.count(old_setup) != 1:
              raise SystemExit(
                  f'Expected exactly one setup-android block, found {text.count(old_setup)}'
              )
          text = text.replace(old_setup, '', 1)

          old_name = "      - name: Install Android SDK cmdline-tools v12\n"
          new_name = "      - name: Install Android SDK cmdline-tools 16.0\n"
          if text.count(old_name) != 1:
              raise SystemExit(
                  f'Expected exactly one cmdline-tools v12 label, found {text.count(old_name)}'
              )
          text = text.replace(old_name, new_name, 1)

          old_tail = (
              "          rm -rf /tmp/tools.zip /tmp/cmdline-extract\n"
              "\n"
              "      - name: Install Android NDK\n"
          )
          new_tail = (
              "          rm -rf /tmp/tools.zip /tmp/cmdline-extract\n"
              "\n"
              "          SDKMANAGER=\"$ANDROID_CUSTOM_CMDLINE/latest/bin/sdkmanager\"\n"
              "          test -x \"$SDKMANAGER\"\n"
              "          SDKMANAGER_VERSION=\"$(\"$SDKMANAGER\" --version | tr -d '\\r' | tail -n 1)\"\n"
              "          if [ \"$SDKMANAGER_VERSION\" != \"16.0\" ]; then\n"
              "            echo \"::error::Expected sdkmanager 16.0, got '$SDKMANAGER_VERSION'\"\n"
              "            exit 1\n"
              "          fi\n"
              "          echo \"sdkmanager_version=$SDKMANAGER_VERSION\"\n"
              "\n"
              "      - name: Install Android NDK\n"
          )
          if text.count(old_tail) != 1:
              raise SystemExit(
                  f'Expected exactly one cmdline-tools tail, found {text.count(old_tail)}'
              )
          text = text.replace(old_tail, new_tail, 1)

          path.write_text(text)
          PY

      - name: Verify only workflow changed
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          if [ "$changed" != ".github/workflows/build.yml" ]; then
            echo "Unexpected changes:"
            printf '%s\n' "$changed"
            exit 1
          fi
          git diff -- .github/workflows/build.yml

      - name: Validate pinned sdkmanager and NDK
        run: |
          set -euo pipefail
          : "${ANDROID_SDK_ROOT:?ANDROID_SDK_ROOT is not configured by the runner}"

          ANDROID_CUSTOM_CMDLINE="$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsS https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip -o /tmp/tools.zip
          rm -rf "$ANDROID_CUSTOM_CMDLINE/latest" /tmp/cmdline-extract
          mkdir -p "$ANDROID_CUSTOM_CMDLINE"
          unzip -q /tmp/tools.zip -d /tmp/cmdline-extract
          mv /tmp/cmdline-extract/cmdline-tools "$ANDROID_CUSTOM_CMDLINE/latest"
          rm -rf /tmp/tools.zip /tmp/cmdline-extract

          SDKMANAGER="$ANDROID_CUSTOM_CMDLINE/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          VERSION="$("$SDKMANAGER" --version | tr -d '\r' | tail -n 1)"
          echo "sdkmanager_version=$VERSION"
          test "$VERSION" = "16.0"

          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;28.2.13676358"
          test -d "$ANDROID_SDK_ROOT/ndk/28.2.13676358"

      - name: Commit verified workflow fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/build.yml
          git diff --cached --check
          git commit -m 'ci: pin sdkmanager without redundant setup action [sdkmanager-fix]'
          git push origin HEAD:codex/fix-sdkmanager-version
