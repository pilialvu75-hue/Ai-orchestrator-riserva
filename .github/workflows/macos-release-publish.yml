name: Publish macOS Release Asset

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/macos-release-publish.yml'
      - 'macos/**'
      - 'native/macos/**'
      - 'lib/core/system/update/**'
  workflow_run:
    workflows:
      - Build & Release APK
    types:
      - completed
    branches:
      - main

permissions:
  contents: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: macos-release-publish-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  validate-publisher:
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Validate publisher contract
        shell: bash
        run: |
          set -euo pipefail
          test -f native/macos/build_llama_cli.sh
          test -f native/macos/package_dmg.sh
          test -f native/macos/sign_notarize_release.sh
          bash -n native/macos/sign_notarize_release.sh
          test -f macos/Runner/Release.entitlements
          command -v hdiutil >/dev/null
          command -v codesign >/dev/null
          command -v gh >/dev/null
          grep -Eq '^version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+(\+[0-9]+)?[[:space:]]*$' pubspec.yaml
          grep -q 'AI-Orchestrator-macOS.dmg' .github/workflows/macos-release-publish.yml
          echo 'macOS release publisher contract is valid.'

  publish-macos:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Check production signing availability
        id: signing
        shell: bash
        env:
          SIGNING_P12: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$SIGNING_P12" ]] || missing+=("MACOS_DEVELOPER_ID_P12_BASE64")
          [[ -n "$SIGNING_PASSWORD" ]] || missing+=("MACOS_DEVELOPER_ID_P12_PASSWORD")
          [[ -n "$NOTARY_KEY" ]] || missing+=("APPLE_NOTARY_KEY_BASE64")
          [[ -n "$NOTARY_KEY_ID" ]] || missing+=("APPLE_NOTARY_KEY_ID")
          [[ -n "$NOTARY_ISSUER_ID" ]] || missing+=("APPLE_NOTARY_ISSUER_ID")

          if (( ${#missing[@]} > 0 )); then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=macOS production publisher skipped::Developer ID/notarization credentials are not configured: ${missing[*]}. Ordinary PR macOS CI remains available with ad-hoc signing."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout exact Android release commit
        if: steps.signing.outputs.ready == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Setup Flutter
        if: steps.signing.outputs.ready == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable macOS desktop
        if: steps.signing.outputs.ready == 'true'
        run: flutter config --enable-macos-desktop

      - name: Resolve coordinated release version
        if: steps.signing.outputs.ready == 'true'
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)(\+[0-9]+)?[[:space:]]*$/\1/p' pubspec.yaml | head -n 1)"
          version_code='${{ github.event.workflow_run.run_number }}'
          if [[ -z "$version_name" ]]; then
            echo 'Unable to resolve semantic application version from pubspec.yaml.' >&2
            exit 1
          fi
          if [[ ! "$version_code" =~ ^[0-9]+$ ]]; then
            echo "Invalid Android workflow run number: $version_code" >&2
            exit 1
          fi

          release_version="$version_name+$version_code"
          tag="v$release_version"
          python3 - "$release_version" <<'PY'
          import re
          import sys
          from pathlib import Path

          release_version = sys.argv[1]
          path = Path('pubspec.yaml')
          text = path.read_text()
          updated, count = re.subn(
              r'^version:\s*.*$',
              f'version: {release_version}',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit('Failed to inject coordinated macOS release version into pubspec.yaml.')
          path.write_text(updated)
          PY

          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Coordinated macOS version: $release_version"
          echo "Target GitHub release: $tag"
          echo "Source commit: ${{ github.event.workflow_run.head_sha }}"

      - name: Resolve Flutter dependencies
        if: steps.signing.outputs.ready == 'true'
        run: flutter pub get

      - name: Validate versioned Xcode project
        if: steps.signing.outputs.ready == 'true'
        run: xcodebuild -project macos/Runner.xcodeproj -list

      - name: Build bundled llama.cpp runtime
        if: steps.signing.outputs.ready == 'true'
        run: bash native/macos/build_llama_cli.sh

      - name: Build coordinated macOS release
        if: steps.signing.outputs.ready == 'true'
        run: flutter build macos --release

      - name: Embed macOS runtime
        if: steps.signing.outputs.ready == 'true'
        id: app
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$PWD/build/macos/Build/Products/Release"
          app_path="$(find "$release_dir" -maxdepth 1 -type d -name '*.app' -print -quit)"
          helper_source="$PWD/build/llama-macos/bin/llama-completion"

          if [[ -z "$app_path" || ! -d "$app_path" ]]; then
            echo "No .app bundle found under $release_dir" >&2
            exit 1
          fi
          if [[ ! -x "$helper_source" ]]; then
            echo "Built llama-completion helper is missing: $helper_source" >&2
            exit 1
          fi

          helper_target="$app_path/Contents/MacOS/llama-completion"
          install -m 0755 "$helper_source" "$helper_target"

          archs="$(lipo -archs "$helper_target")"
          if [[ "$archs" != *arm64* || "$archs" != *x86_64* ]]; then
            echo "Bundled llama-completion is not Universal 2: $archs" >&2
            exit 1
          fi

          dependencies="$(otool -L "$helper_target" | awk '/^\t/{print}')"
          if grep -Eq '/(opt/homebrew|usr/local|Users|private|Volumes)/' <<<"$dependencies"; then
            echo 'Bundled llama-completion contains a non-portable dependency' >&2
            printf '%s\n' "$dependencies" >&2
            exit 1
          fi

          short_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_path/Contents/Info.plist")"
          build_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_path/Contents/Info.plist")"
          if [[ "$short_version" != '${{ steps.version.outputs.version_name }}' ]]; then
            echo "Unexpected CFBundleShortVersionString: $short_version" >&2
            exit 1
          fi
          if [[ "$build_version" != '${{ steps.version.outputs.version_code }}' ]]; then
            echo "Unexpected CFBundleVersion: $build_version" >&2
            exit 1
          fi

          echo "app_path=$app_path" >> "$GITHUB_OUTPUT"
          echo "helper_path=$helper_target" >> "$GITHUB_OUTPUT"
          echo "macOS app embedded and ready for Developer ID signing: $app_path"

      - name: Developer ID sign, notarize, staple and build verified DMG
        if: steps.signing.outputs.ready == 'true'
        id: dmg
        shell: bash
        env:
          SIGNING_P12: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail

          keychain="$RUNNER_TEMP/ai-orchestrator-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          p12_path="$RUNNER_TEMP/developer-id.p12"
          notary_key_path="$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"
          output_dir="$PWD/build/macos/release-publish"
          dmg_path="$output_dir/AI-Orchestrator-macOS.dmg"
          mkdir -p "$output_dir"

          cleanup() {
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            rm -f "$p12_path" "$notary_key_path"
          }
          trap cleanup EXIT

          printf '%s' "$SIGNING_P12" | base64 -D > "$p12_path"
          printf '%s' "$NOTARY_KEY" | base64 -D > "$notary_key_path"
          chmod 600 "$p12_path" "$notary_key_path"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12_path" \
            -k "$keychain" \
            -P "$SIGNING_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"

          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' \
            | head -n 1)"
          if [[ -z "$identity" ]]; then
            echo "No Developer ID Application identity was imported." >&2
            exit 1
          fi

          bash native/macos/sign_notarize_release.sh \
            '${{ steps.app.outputs.app_path }}' \
            "$dmg_path" \
            "$identity" \
            "$notary_key_path" \
            "$NOTARY_KEY_ID" \
            "$NOTARY_ISSUER_ID" \
            "$PWD/macos/Runner/Release.entitlements"

          hash_path="$dmg_path.sha256"
          if [[ ! -s "$dmg_path" || ! -s "$hash_path" ]]; then
            echo "Notarized publisher did not produce the expected DMG and digest." >&2
            exit 1
          fi

          dmg_size="$(stat -f '%z' "$dmg_path")"
          dmg_sha256="$(shasum -a 256 "$dmg_path" | awk '{print tolower($1)}')"
          expected_sha256="$(awk '{print tolower($1)}' "$hash_path")"
          if [[ "$dmg_sha256" != "$expected_sha256" ]]; then
            echo "Final post-stapling DMG digest does not match sidecar." >&2
            exit 1
          fi

          echo "dmg_path=$dmg_path" >> "$GITHUB_OUTPUT"
          echo "hash_path=$hash_path" >> "$GITHUB_OUTPUT"
          echo "dmg_size=$dmg_size" >> "$GITHUB_OUTPUT"
          echo "dmg_sha256=$dmg_sha256" >> "$GITHUB_OUTPUT"
          echo "Notarized macOS DMG: $dmg_path ($dmg_size bytes)"
          echo "SHA256: $dmg_sha256"

      - name: Verify matching Android release exists
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view '${{ steps.version.outputs.tag }}' \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,publishedAt >/dev/null

      - name: Publish macOS DMG into matching GitHub Release
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload '${{ steps.version.outputs.tag }}' \
            '${{ steps.dmg.outputs.dmg_path }}' \
            '${{ steps.dmg.outputs.hash_path }}' \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

      - name: Verify published macOS release assets and digest
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ steps.version.outputs.tag }}'
          assets="$(gh release view "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name')"
          grep -Fxq 'AI-Orchestrator-macOS.dmg' <<<"$assets"
          grep -Fxq 'AI-Orchestrator-macOS.dmg.sha256' <<<"$assets"

          published_digest="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
            --jq '.assets[] | select(.name == "AI-Orchestrator-macOS.dmg") | .digest')"
          if [[ ! "$published_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Published macOS DMG is missing a verified GitHub SHA-256 digest: $published_digest" >&2
            exit 1
          fi
          if [[ "${published_digest#sha256:}" != '${{ steps.dmg.outputs.dmg_sha256 }}' ]]; then
            echo 'Published GitHub digest does not match the locally verified DMG.' >&2
            exit 1
          fi
          echo "macOS release assets verified on $tag: $published_digest"

      - name: Preserve published DMG artifact
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ai-orchestrator-macos-release-${{ steps.version.outputs.release_version }}
          path: |
            ${{ steps.dmg.outputs.dmg_path }}
            ${{ steps.dmg.outputs.hash_path }}
          if-no-files-found: error
          retention-days: 14
