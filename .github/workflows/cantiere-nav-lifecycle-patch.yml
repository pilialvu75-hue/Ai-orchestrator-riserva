name: Apply Cantiere dashboard ownership patch

on:
  push:
    branches:
      - fix/cantiere-project-lifecycle-nav-v1

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[cantiere-nav-applied]') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch dashboard ownership
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('lib/app_factory/workshop/workshop_dashboard_page.dart')
          text = path.read_text()

          text, count = re.subn(
              r"\n  bool get _ownsDashboardController =>\n\s+widget\._dashboardController != null;\n",
              "\n",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'ownership getter matches={count}')

          text, count = re.subn(
              r"\n    if \(_ownsDashboardController\) \{\n      _dashboardController\?\.dispose\(\);\n    \}\n",
              "\n    // Injected production state is owned above this route.\n    // Route disposal must not terminate or erase the project lifecycle.\n",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'dashboard dispose matches={count}')

          path.write_text(text)
          PY
          git diff --check
      - name: Commit patched dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/app_factory/workshop/workshop_dashboard_page.dart
          git commit -m "fix(cantiere): preserve injected project state [cantiere-nav-applied]"
          git push origin HEAD:fix/cantiere-project-lifecycle-nav-v1
