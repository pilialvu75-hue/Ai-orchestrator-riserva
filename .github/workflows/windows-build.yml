name: Build Windows Desktop

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'windows/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain
        shell: pwsh
        run: |
          flutter --version
          flutter doctor -v

      - name: Resolve Flutter dependencies
        shell: pwsh
        run: flutter pub get

      - name: Analyze Dart sources
        shell: pwsh
        run: flutter analyze

      - name: Run Flutter tests
        shell: pwsh
        run: flutter test

      - name: Build Windows release
        shell: pwsh
        run: flutter build windows --release

      - name: Prepare portable Windows bundle
        id: bundle
        shell: pwsh
        run: |
          $releaseDir = Join-Path $PWD 'build\windows\x64\runner\Release'
          if (-not (Test-Path $releaseDir)) {
            throw "Windows release directory not found: $releaseDir"
          }

          $exe = Join-Path $releaseDir 'ai_orchestrator.exe'
          if (-not (Test-Path $exe)) {
            throw "Windows executable not found: $exe"
          }

          if (-not (Test-Path (Join-Path $releaseDir 'data'))) {
            throw 'Flutter data directory is missing from the Windows release bundle.'
          }

          $runtimeDlls = @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')
          foreach ($dll in $runtimeDlls) {
            if (Test-Path (Join-Path $releaseDir $dll)) {
              continue
            }

            $candidate = $null
            if ($env:VCToolsRedistDir) {
              $candidate = Get-ChildItem -Path $env:VCToolsRedistDir -Filter $dll -Recurse -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match '\\x64\\' } |
                Select-Object -First 1
            }

            if ($candidate) {
              Copy-Item $candidate.FullName (Join-Path $releaseDir $dll)
              Write-Host "Bundled $dll from Visual C++ redistributables."
            } else {
              Write-Warning "Could not locate $dll for application-local packaging."
            }
          }

          $zipPath = Join-Path $PWD 'ai-orchestrator-windows-x64.zip'
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }
          Compress-Archive -Path (Join-Path $releaseDir '*') -DestinationPath $zipPath -CompressionLevel Optimal

          $size = (Get-Item $zipPath).Length
          if ($size -le 0) {
            throw 'Generated Windows archive is empty.'
          }

          "release_dir=$releaseDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "zip_path=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Windows portable bundle: $zipPath ($size bytes)"

      - name: Upload Windows portable bundle
        uses: actions/upload-artifact@v4
        with:
          name: ai-orchestrator-windows-x64
          path: ai-orchestrator-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
