name: Ads Kill - Windows 11 beta
on:
  push:
    branches:
      - ads-kill/windows-prototype
    paths:
      - 'ads-kill/windows/**'
      - '.github/workflows/ads-kill-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run offline HOSTS section tests
        shell: pwsh
        run: dotnet run --project ads-kill/windows/AdsKill.Windows.Tests/AdsKill.Windows.Tests.csproj --configuration Release
      - name: Publish Windows x64 self-contained executable
        shell: pwsh
        run: |
          dotnet publish ads-kill/windows/AdsKill.Windows/AdsKill.Windows.csproj `
            --configuration Release --runtime win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None -p:PublishTrimmed=false `
            --output dist
      - name: Package executable with SHA256 and instructions
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'dist/AdsKill.Windows.exe'
          if (!(Test-Path $exe)) { throw "Missing Ads Kill executable" }
          $folder = Join-Path $env:GITHUB_WORKSPACE 'package'
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          Copy-Item $exe -Destination $folder
          Copy-Item ads-kill/windows/README.md -Destination (Join-Path $folder 'README.md')
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          "$hash  AdsKill.Windows.exe" | Set-Content (Join-Path $folder 'SHA256SUMS.txt') -Encoding utf8
          Compress-Archive -Path "$folder/*" -DestinationPath 'AdsKill-Windows-v0.1.0-beta1-win-x64.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Ads-Kill-Windows-0.1.0-beta1
          path: AdsKill-Windows-v0.1.0-beta1-win-x64.zip
          retention-days: 30
      - name: Publish Windows beta prerelease
        if: github.ref == 'refs/heads/ads-kill/windows-prototype'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = 'ads-kill-windows-v0.1.0-beta1'
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag 'AdsKill-Windows-v0.1.0-beta1-win-x64.zip' `
              --target "$env:GITHUB_SHA" --prerelease `
              --title 'Ads Kill Windows 0.1.0 beta1 (unsigned, Windows 11 x64)' `
              --notes 'Independent Windows HOSTS filtering prototype. Requires UAC admin consent. Unsigned: do not disable Smart App Control. Backups and reversible marked block. Windows 8.1 not supported.'
            if ($LASTEXITCODE -ne 0) { throw "Release upload failed" }
          }
