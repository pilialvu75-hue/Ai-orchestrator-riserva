name: Aivexus Web Authenticated D1 Operation Gate

on:
  pull_request:
    paths:
      - 'functions/api/cantiere/executions/reserve.js'
      - 'functions/api/cantiere/executions/status.js'
      - 'functions/api/cantiere/executions/download.js'
      - 'functions/api/cantiere/executions/advance.js'
      - 'scripts/web/advance_web_counter.mjs'
      - 'scripts/web/counter_runner_*.mjs'
      - 'scripts/web/github_counter_runner_client.mjs'
      - 'test/airlab/web_*counter_runner*.mjs'
      - 'scripts/web/web_execution_artifact_download.mjs'
      - 'scripts/web/d1_web_counter_artifact_store.mjs'
      - 'scripts/web/d1_web_counter_dispatch.mjs'
      - 'scripts/web/run_web_counter_attempt.mjs'
      - 'scripts/web/*counter*.py'
      - 'scripts/web/build_verified_counter_zip.mjs'
      - 'test/airlab/web_counter_smoke.mjs'
      - 'scripts/web/d1_execution_journal_store.mjs'
      - 'scripts/web/sql/*.sql'
      - 'functions/api/cantiere/proposals/approve.js'
      - 'functions/api/cantiere/proposals/counter.js'
      - 'functions/api/cantiere/proposals/generate.js'
      - 'functions/api/cantiere/proposals/quota.js'
      - 'functions/api/cantiere/proposals/verify.js'
      - 'functions/api/cantiere/proposals/download.js'
      - 'functions/api/cantiere/proposals/source.js'
      - 'functions/api/cantiere/proposals/preview.js'
      - 'scripts/web/web_application_preview.mjs'
      - 'scripts/web/d1_web_application_verification.mjs'
      - 'scripts/web/web_application_checks.mjs'
      - 'scripts/web/web_application_runner_packet.mjs'
      - 'scripts/web/web_runner_envelope.mjs'
      - 'functions/api/cantiere/inference.js'
      - 'functions/api/cantiere/capabilities.js'
      - 'functions/api/cantiere/models.js'
      - 'scripts/web/generate_web_application.mjs'
      - 'scripts/web/authenticated_web_project_operation.mjs'
      - 'test/airlab/web_authenticated_project_operation.mjs'
      - '.github/workflows/web-authenticated-project-operation.yml'
      - 'scripts/web/cloudflare_access_principal_resolver.mjs'
      - 'scripts/web/cloudflare_access_jwt_verifier.mjs'
      - 'scripts/web/d1_web_proposal_approval_writer.mjs'
      - 'scripts/web/d1_approval_reservation_store.mjs'
      - 'scripts/web/approved_execution_reservation.mjs'
  push:
    branches:
      - main
    paths:
      - 'functions/api/cantiere/executions/reserve.js'
      - 'functions/api/cantiere/executions/status.js'
      - 'functions/api/cantiere/executions/download.js'
      - 'functions/api/cantiere/executions/advance.js'
      - 'scripts/web/advance_web_counter.mjs'
      - 'scripts/web/counter_runner_*.mjs'
      - 'scripts/web/github_counter_runner_client.mjs'
      - 'test/airlab/web_*counter_runner*.mjs'
      - 'scripts/web/web_execution_artifact_download.mjs'
      - 'scripts/web/d1_web_counter_artifact_store.mjs'
      - 'scripts/web/d1_web_counter_dispatch.mjs'
      - 'scripts/web/run_web_counter_attempt.mjs'
      - 'scripts/web/*counter*.py'
      - 'scripts/web/build_verified_counter_zip.mjs'
      - 'test/airlab/web_counter_smoke.mjs'
      - 'scripts/web/d1_execution_journal_store.mjs'
      - 'scripts/web/sql/*.sql'
      - 'functions/api/cantiere/proposals/approve.js'
      - 'functions/api/cantiere/proposals/counter.js'
      - 'functions/api/cantiere/proposals/generate.js'
      - 'functions/api/cantiere/proposals/quota.js'
      - 'functions/api/cantiere/proposals/verify.js'
      - 'functions/api/cantiere/proposals/download.js'
      - 'functions/api/cantiere/proposals/source.js'
      - 'functions/api/cantiere/proposals/preview.js'
      - 'scripts/web/web_application_preview.mjs'
      - 'scripts/web/d1_web_application_verification.mjs'
      - 'scripts/web/web_application_checks.mjs'
      - 'scripts/web/web_application_runner_packet.mjs'
      - 'scripts/web/web_runner_envelope.mjs'
      - 'functions/api/cantiere/inference.js'
      - 'functions/api/cantiere/capabilities.js'
      - 'functions/api/cantiere/models.js'
      - 'scripts/web/generate_web_application.mjs'
      - 'scripts/web/authenticated_web_project_operation.mjs'
      - 'test/airlab/web_authenticated_project_operation.mjs'
      - '.github/workflows/web-authenticated-project-operation.yml'
      - 'scripts/web/cloudflare_access_principal_resolver.mjs'
      - 'scripts/web/cloudflare_access_jwt_verifier.mjs'
      - 'scripts/web/d1_web_proposal_approval_writer.mjs'
      - 'scripts/web/d1_approval_reservation_store.mjs'
      - 'scripts/web/approved_execution_reservation.mjs'

permissions:
  contents: read

jobs:
  authenticated-web-project-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Python 3.11 for the fixed counter
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify authenticated HTTP-to-D1 operation contract
        run: |
          node --test test/airlab/web_authenticated_project_operation.mjs
          node --test test/airlab/web_counter_runner_envelope.mjs test/airlab/web_github_counter_runner_client.mjs
      - name: Bundle Cloudflare Pages Functions
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npx --yes wrangler@4 pages functions build functions --outfile "$RUNNER_TEMP/aivexus-pages-worker.mjs"
          test -s "$RUNNER_TEMP/aivexus-pages-worker.mjs"
          for route in executions/reserve executions/status executions/download executions/advance proposals/counter proposals/approve proposals/generate proposals/quota proposals/verify proposals/download proposals/source proposals/preview; do
            grep -Fq "/api/cantiere/$route" "$RUNNER_TEMP/aivexus-pages-worker.mjs"
          done
      - name: Apply Web migrations to local D1
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          local_d1="$(mktemp -d "$RUNNER_TEMP/aivexus-d1.XXXXXX")"
          cp -r scripts/web/sql "$local_d1/migrations"
          cat > "$local_d1/wrangler.toml" <<'TOML'
          name = "aivexus-web-ci"
          compatibility_date = "2026-11-19"

          [[d1_databases]]
          binding = "AIVEXUS_WEB_D1"
          database_name = "aivexus-web-ci"
          database_id = "00000000-0000-4000-8000-000000000001"
          TOML
          wrangler=(npx --yes wrangler@4)
          local_args=(--local --config "$local_d1/wrangler.toml" --persist-to "$local_d1/state")
          "${wrangler[@]}" d1 migrations apply AIVEXUS_WEB_D1 "${local_args[@]}"
          "${wrangler[@]}" d1 execute AIVEXUS_WEB_D1 "${local_args[@]}" --json \
            --command 'SELECT (SELECT COUNT(*) FROM d1_migrations) AS migrations,
              (SELECT COUNT(*) FROM web_project_approvals) AS approvals,
              (SELECT COUNT(*) FROM web_execution_reservations) AS reservations,
              (SELECT COUNT(*) FROM web_execution_journal_events) AS journal,
              (SELECT COUNT(*) FROM web_execution_artifact_receipts) AS receipts,
              (SELECT COUNT(*) FROM web_counter_artifacts) AS artifacts,
              (SELECT COUNT(*) FROM web_counter_dispatch) AS dispatches,
              (SELECT COUNT(*) FROM web_app_generations) AS generations,
              (SELECT COUNT(*) FROM web_app_verifications) AS verifications' \
            | jq -e '.[0] | .success and (.results == [{"migrations":7,"approvals":0,"reservations":0,"journal":0,"receipts":0,"artifacts":0,"dispatches":0,"generations":0,"verifications":0}])'
      - name: Regression for verified Access JWT and D1 reservations
        run: |
          node --test test/airlab/web_access_jwt_verifier.mjs
          node --test test/airlab/web_access_principal_resolver.mjs
          node --test test/airlab/web_d1_proposal_approval_writer.mjs
          node --test test/airlab/web_d1_approval_reservation.mjs
