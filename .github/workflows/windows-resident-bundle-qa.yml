name: Windows Resident Bundle QA

on:
  pull_request:
    paths:
      - '.github/workflows/windows-release-publish.yml'
      - '.github/workflows/windows-inference-candidate.yml'
      - '.github/workflows/windows-computer-use-beta.yml'
      - '.github/workflows/windows-cuda-unsigned-owner-beta.yml'
      - '.github/workflows/windows-resident-bundle-qa.yml'
      - 'tool/bundle_windows_modern_runtime.ps1'
      - 'tool/bundle_windows_cuda_runtime.ps1'
      - 'tool/test_windows_cuda_bundle.ps1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-resident-bundle:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Verify pinned CUDA, Vulkan and CPU payload; CPU startup and CUDA import audit
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:RUNNER_TEMP 'resident-bundle-qa'
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          & (Join-Path $PWD 'tool\bundle_windows_modern_runtime.ps1') -ReleaseDir $releaseDir
          & (Join-Path $PWD 'tool\bundle_windows_cuda_runtime.ps1') -ReleaseDir $releaseDir
          & (Join-Path $PWD 'tool\test_windows_cuda_bundle.ps1') -ReleaseDir $releaseDir
