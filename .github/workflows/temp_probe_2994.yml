name: temp-probe-2994
on: push
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cantiere/build-repair-multitarget-2994
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: |
          python3 -c "from pathlib import Path; p=Path('lib/app_factory/workshop/workshop_proposal_implementation_runner.dart'); s=p.read_text(); old='request.targetFiles.length != 1'; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old, 'request.targetFiles.isEmpty', 1))"
          python3 -c "from pathlib import Path; p=Path('test/app_factory/workshop/workshop_proposal_implementation_runner_test.dart'); s=p.read_text(); old=\"test('bounded build repair reads one oversized target without blind replacement',\"; assert s.count(old)==1, s.count(old); s=s.replace(old, \"test('bounded build repair reads oversized target from legacy multi-target scope',\", 1); old2=\"files: <String, String>{'lib/main.dart': oversizedMain},\"; assert s.count(old2)==1, s.count(old2); s=s.replace(old2, \"files: <String, String>{'lib/main.dart': oversizedMain, 'lib/app.dart': 'class ExistingApp {}'},\", 1); old3=\"instruction: 'BUILD REPAIR ATTEMPT: repair the existing entry point.',\\n          operation: WorkshopOperation.fix,\\n          targetFiles: <String>['lib/main.dart'],\"; assert s.count(old3)==1, s.count(old3); s=s.replace(old3, \"instruction: 'BUILD REPAIR ATTEMPT: repair the existing entry point.',\\n          operation: WorkshopOperation.fix,\\n          targetFiles: <String>['lib/main.dart', 'lib/app.dart'],\", 1); p.write_text(s)"
          git diff --check
          flutter pub get
          flutter test test/app_factory/workshop/workshop_proposal_implementation_runner_test.dart
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/app_factory/workshop/workshop_proposal_implementation_runner.dart test/app_factory/workshop/workshop_proposal_implementation_runner_test.dart
          git rm .github/workflows/_temp_patch_cantiere_2994.yml .github/workflows/temp_cantiere_2994.yml .github/workflows/temp_probe_2994.yml
          git commit -m 'fix(cantiere): support persisted multi-target build repair'
          git push origin HEAD:cantiere/build-repair-multitarget-2994
