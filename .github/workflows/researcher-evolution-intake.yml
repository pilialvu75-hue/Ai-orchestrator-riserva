name: Researcher Evolution Intake

on:
  repository_dispatch:
    types: [researcher_evolution_work]

permissions:
  contents: read

concurrency:
  group: researcher-evolution-${{ github.event.client_payload.proposal_id }}
  cancel-in-progress: false

jobs:
  validate-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate isolated evolution contract
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          payload = json.loads(os.environ["PAYLOAD"])
          required = ("proposal_id", "capability_id", "knowledge_delta", "acceptance_gates", "mutation_policy")
          missing = [key for key in required if not payload.get(key)]
          if missing:
              raise SystemExit(f"missing required fields: {', '.join(missing)}")
          if payload["mutation_policy"] != "isolated_candidate_no_library_mutation":
              raise SystemExit("unsafe mutation policy")
          if not isinstance(payload["knowledge_delta"], list) or not payload["knowledge_delta"]:
              raise SystemExit("knowledge_delta must be a non-empty list")
          if not isinstance(payload["acceptance_gates"], list) or not payload["acceptance_gates"]:
              raise SystemExit("acceptance_gates must be a non-empty list")
          safe = {
              "schema": "ai-orchestrator.researcher-evolution-intake.v1",
              "proposal_id": payload["proposal_id"],
              "capability_id": payload["capability_id"],
              "knowledge_delta": payload["knowledge_delta"],
              "acceptance_gates": payload["acceptance_gates"],
              "mutation_policy": payload["mutation_policy"],
              "source_code_transferred": False,
          }
          with open("researcher-evolution-work.json", "w", encoding="utf-8") as handle:
              json.dump(safe, handle, indent=2, sort_keys=True)
          PY
      - name: Materialize Cantiere task contract
        run: |
          python - <<'PY'
          import json

          with open("researcher-evolution-work.json", encoding="utf-8") as handle:
              work = json.load(handle)

          proposal_id = str(work["proposal_id"]).strip()
          capability_id = str(work["capability_id"]).strip()
          deltas = [str(value).strip() for value in work["knowledge_delta"] if str(value).strip()]
          gates = [str(value).strip() for value in work["acceptance_gates"] if str(value).strip()]

          task = {
              "id": f"research-evolution:{proposal_id}",
              "title": f"Evolve {capability_id}",
              "objective": (
                  f"Create or improve our independently maintained module for {capability_id} "
                  "using only the normalized Researcher knowledge delta. Produce an isolated "
                  "candidate; do not mutate the stable Library."
              ),
              "kind": "codeModification",
              "mode": "hybrid",
              "preferredResource": "local",
              "fallbackResources": ["githubAgent", "githubActions", "hybridAi"],
              "priority": "normal",
              "status": "planned",
              "instructions": [
                  "Use the current in-house module as the baseline when one exists.",
                  "Apply only technically useful knowledge deltas.",
                  "Prefer the best correct implementation; do not introduce artificial differences.",
                  "Do not copy research-only upstream source code.",
                  "Create a candidate version in an isolated workspace.",
                  "Run the required validation gates before requesting promotion.",
                  *[f"Knowledge delta: {delta}" for delta in deltas],
              ],
              "constraints": [
                  "Never mutate the stable Library during implementation.",
                  "Never bypass license, security, regression, or Library contract gates.",
                  "Never execute untrusted discovered source code as part of synthesis.",
              ],
              "acceptanceCriteria": [
                  {"id": gate, "description": f"Researcher gate {gate} must pass.", "required": True}
                  for gate in gates
              ],
              "fileScope": {
                  "allowed": ["candidate_workspace/**"],
                  "readOnly": ["library_baseline/**", "research_knowledge/**"],
                  "forbidden": ["stable_library/**"],
              },
              "budget": {
                  "maxCredits": 0,
                  "reservedCredits": 0,
                  "minimumReserveCredits": 0,
                  "estimatedCredits": 0,
                  "allowOverrun": False,
              },
              "requiredCheckpoints": ["candidate_created", "tests_completed", "validation_completed"],
              "checkpoint": None,
              "parentTaskId": None,
              "dependsOn": [],
              "tags": ["researcher-v2", "module-evolution", capability_id],
              "metadata": {
                  "researcherProposalId": proposal_id,
                  "capabilityId": capability_id,
                  "mutationPolicy": work["mutation_policy"],
                  "sourceCodeTransferred": False,
              },
          }
          with open("workshop-task-contract.json", "w", encoding="utf-8") as handle:
              json.dump(task, handle, indent=2, sort_keys=True)
          PY
      - name: Upload validated Cantiere intake
        uses: actions/upload-artifact@v4
        with:
          name: researcher-evolution-${{ github.event.client_payload.proposal_id }}
          path: |
            researcher-evolution-work.json
            workshop-task-contract.json
          if-no-files-found: error
          retention-days: 14
