name: Researcher Evolution Intake

on:
  repository_dispatch:
    types: [researcher_evolution_work]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: researcher-evolution-${{ github.event.client_payload.proposal_id }}
  cancel-in-progress: false

jobs:
  validate-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Cantiere main contract
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Cantiere dependencies
        run: flutter pub get

      - name: Persist repository dispatch payload
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
          PAYLOAD_FILE: ${{ runner.temp }}/researcher-evolution-payload.json
        run: |
          python - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["PAYLOAD"])
          with open(os.environ["PAYLOAD_FILE"], "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2, sort_keys=True)
          PY

      - name: Materialize canonical Cantiere and durable contracts
        env:
          PAYLOAD_FILE: ${{ runner.temp }}/researcher-evolution-payload.json
          INTAKE_DIR: ${{ runner.temp }}/researcher-evolution-intake
        run: |
          set -euo pipefail
          flutter test \
            test/app_factory/workshop/researcher_evolution_intake_workflow_test.dart \
            --reporter expanded

      - name: Verify fail-closed handoff invariants
        env:
          INTAKE_DIR: ${{ runner.temp }}/researcher-evolution-intake
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["INTAKE_DIR"])
          with (root / "researcher-evolution-work.json").open(encoding="utf-8") as handle:
              work = json.load(handle)
          with (root / "workshop-task-contract.json").open(encoding="utf-8") as handle:
              task = json.load(handle)
          with (root / "workshop-durable-project.json").open(encoding="utf-8") as handle:
              durable = json.load(handle)

          if work.get("source_code_transferred") is not False:
              raise SystemExit("Researcher intake must never transfer source code")
          if task.get("metadata", {}).get("sourceCodeTransferred") is not False:
              raise SystemExit("Cantiere contract lost the no-source-transfer invariant")
          if task.get("metadata", {}).get("mutationPolicy") != "isolated_candidate_no_library_mutation":
              raise SystemExit("unsafe Researcher mutation policy")
          scope = task.get("fileScope", {})
          if scope.get("allowed") != ["candidate_workspace/**"]:
              raise SystemExit("Researcher task writable scope is not isolated")
          if "stable_library/**" not in scope.get("forbidden", []):
              raise SystemExit("stable Library is not explicitly forbidden")
          if durable.get("state") != "ready":
              raise SystemExit("durable Researcher project is not ready")
          tasks = durable.get("tasks", {})
          if len(tasks) != 1:
              raise SystemExit("durable Researcher intake must contain exactly one task")
          durable_task = next(iter(tasks.values()))
          if durable_task.get("state") != "ready":
              raise SystemExit("durable Researcher task is not ready")
          if durable_task.get("capability") != "coding.module_evolution":
              raise SystemExit("unexpected durable capability")
          PY

      - name: Upload validated Cantiere intake
        uses: actions/upload-artifact@v6
        with:
          name: researcher-evolution-${{ github.event.client_payload.proposal_id }}
          path: ${{ runner.temp }}/researcher-evolution-intake/
          if-no-files-found: error
          retention-days: 14
