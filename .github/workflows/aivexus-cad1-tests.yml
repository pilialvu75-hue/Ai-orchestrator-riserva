name: Aivexus CAD-1 Domain Tests

on:
  pull_request:
    paths:
      - '.github/workflows/aivexus-cad1-tests.yml'
      - 'tools/aivexus/cad/**'
      - 'lib/app_factory/workshop/domains/cad/**'
      - 'test/app_factory/workshop/domains/cad/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aivexus-cad1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cadquery-domain:
    name: Measured CAD / real STEP STL 3MF
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out PR code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure supported Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install isolated domain dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: 'cadquery==2.8.0' 'trimesh==4.11.1' 'networkx==3.6.1' 'lxml==6.1.1'

      - name: Run real CAD regression tests
        run: |
          python -m unittest discover -s tools/aivexus/cad -p test_cad1.py -v

      - name: Export and validate revision 1
        run: |
          mkdir -p "$RUNNER_TEMP/cad1/revision_1"
          python tools/aivexus/cad/parametric_plate.py tools/aivexus/cad/fixtures/plate_spec.json --out "$RUNNER_TEMP/cad1/revision_1"
          python tools/aivexus/cad/validate_plate.py tools/aivexus/cad/fixtures/plate_spec.json --exports "$RUNNER_TEMP/cad1/revision_1" --report "$RUNNER_TEMP/cad1/revision_1/receipt.json"

      - name: Export and validate revision 2
        run: |
          mkdir -p "$RUNNER_TEMP/cad1/revision_2"
          python - <<'PY'
          import copy, json
          from pathlib import Path
          src = json.loads(Path("tools/aivexus/cad/fixtures/plate_spec.json").read_text(encoding="utf-8"))
          rev2 = copy.deepcopy(src)
          rev2["specRevision"] = 2
          rev2["domainSpec"]["parameters"]["thicknessMm"] = 5
          Path("/tmp/aivexus_cad1_revision2.json").write_text(json.dumps(rev2), encoding="utf-8")
          PY
          python tools/aivexus/cad/parametric_plate.py /tmp/aivexus_cad1_revision2.json --out "$RUNNER_TEMP/cad1/revision_2"
          python tools/aivexus/cad/validate_plate.py /tmp/aivexus_cad1_revision2.json --exports "$RUNNER_TEMP/cad1/revision_2" --report "$RUNNER_TEMP/cad1/revision_2/receipt.json"

      - name: Check sample bytes against receipts and include matching input specs
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from shutil import copyfile

          root = Path(os.environ["RUNNER_TEMP"]) / "cad1"
          specs = {
              1: Path("tools/aivexus/cad/fixtures/plate_spec.json"),
              2: Path("/tmp/aivexus_cad1_revision2.json"),
          }
          suffixes = {"STEP": "step", "STL": "stl", "3MF": "3mf"}
          for revision, source in specs.items():
              directory = root / f"revision_{revision}"
              receipt = json.loads((directory / "receipt.json").read_text(encoding="utf-8"))
              assert receipt["status"] == "PASS" and receipt["notCanonicalEvidence"]
              assert receipt["specRevision"] == revision
              assert hashlib.sha256(source.read_bytes()).hexdigest() == receipt["inputSha256"]
              artifacts = {item["format"]: item for item in receipt["artifacts"]}
              assert set(artifacts) == set(suffixes)
              for fmt, ext in suffixes.items():
                  path = directory / f"plate.{ext}"
                  assert path.is_file() and path.stat().st_size == artifacts[fmt]["sizeBytes"]
                  assert hashlib.sha256(path.read_bytes()).hexdigest() == artifacts[fmt]["sha256"]
                  assert artifacts[fmt]["sourceSpecRevision"] == revision
              copyfile(source, directory / "extension.json")
          PY

      - name: Upload validated CAD samples for external Fusion and print tests
        uses: actions/upload-artifact@v4
        with:
          name: cad1-validated-samples-${{ github.sha }}
          path: ${{ runner.temp }}/cad1/
          if-no-files-found: error
          retention-days: 14
