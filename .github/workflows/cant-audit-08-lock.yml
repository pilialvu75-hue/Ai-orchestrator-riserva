name: Generate pubspec lock once

on:
  push:
    branches:
      - fix/roadmap-cant-audit-08-lock-toolchain

permissions:
  contents: write

jobs:
  generate-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/roadmap-cant-audit-08-lock-toolchain
          fetch-depth: 0

      - name: Setup pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Generate lock with pinned toolchain
        run: |
          set -euo pipefail
          flutter --version
          flutter pub get
          test -s pubspec.lock

      - name: Commit generated lock
        run: |
          set -euo pipefail
          if git diff --quiet -- pubspec.lock && git ls-files --error-unmatch pubspec.lock >/dev/null 2>&1; then
            echo "pubspec.lock already tracked and unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f pubspec.lock
          git commit -m "chore(deps): generate pubspec lock with Flutter 3.47.5"
          git push origin HEAD:fix/roadmap-cant-audit-08-lock-toolchain
