name: Windows 7 Minimal Flutter Smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: windows7-minimal-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-win7-smoke:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain
        shell: pwsh
        run: flutter --version

      - name: Resolve dependencies
        shell: pwsh
        run: flutter pub get

      - name: Build minimal Windows smoke app
        shell: pwsh
        run: flutter build windows --release --target lib/win7_smoke_main.dart

      - name: Apply Windows 7 compatibility patches
        shell: pwsh
        run: |
          $releaseDir = Join-Path $PWD 'build\windows\x64\runner\Release'
          & (Join-Path $PWD 'tool\patch_windows_bundle_win7.ps1') -ReleaseDir $releaseDir

      - name: Verify engine-only executable imports
        shell: pwsh
        run: |
          $releaseDir = Join-Path $PWD 'build\windows\x64\runner\Release'
          $exe = Join-Path $releaseDir 'ai_orchestrator.exe'
          if (-not (Test-Path $exe)) { throw "Smoke executable missing: $exe" }
          $dumpbin = Get-Command dumpbin.exe -ErrorAction SilentlyContinue
          if (-not $dumpbin) {
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            if (Test-Path $vswhere) {
              $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
              if ($vs) {
                $candidate = Get-ChildItem -Path (Join-Path $vs 'VC\Tools\MSVC') -Filter dumpbin.exe -Recurse -ErrorAction SilentlyContinue |
                  Where-Object { $_.FullName -match '\\bin\\Hostx64\\x64\\dumpbin\.exe$' } |
                  Sort-Object FullName -Descending | Select-Object -First 1
                if ($candidate) { $dumpbin = $candidate.FullName }
              }
            }
          }
          if ($dumpbin) {
            $imports = & $dumpbin /dependents $exe | Out-String
            Write-Host $imports
            $pluginImports = @(
              'file_selector_windows_plugin.dll',
              'flutter_secure_storage_windows_plugin.dll',
              'permission_handler_windows_plugin.dll',
              'record_windows_plugin.dll',
              'mp_audio_stream.dll'
            )
            foreach ($plugin in $pluginImports) {
              if ($imports -match [regex]::Escape($plugin)) {
                throw "Engine-only smoke executable still imports native plugin: $plugin"
              }
            }
          } else {
            Write-Warning 'dumpbin.exe unavailable; skipping PE import assertion.'
          }

      - name: Package minimal smoke candidate
        id: package
        shell: pwsh
        run: |
          $releaseDir = Join-Path $PWD 'build\windows\x64\runner\Release'
          $zipPath = Join-Path $PWD 'AI-Orchestrator-Win7-Minimal-Smoke-x64.zip'
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path (Join-Path $releaseDir '*') -DestinationPath $zipPath -CompressionLevel Optimal
          $hash = Get-FileHash -Path $zipPath -Algorithm SHA256
          "$($hash.Hash.ToLowerInvariant())  AI-Orchestrator-Win7-Minimal-Smoke-x64.zip" | Set-Content "$zipPath.sha256" -Encoding ASCII
          "zip_path=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "hash_path=$zipPath.sha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload minimal smoke candidate
        uses: actions/upload-artifact@v4
        with:
          name: ai-orchestrator-win7-minimal-smoke-x64
          path: |
            ${{ steps.package.outputs.zip_path }}
            ${{ steps.package.outputs.hash_path }}
          if-no-files-found: error
          retention-days: 14
