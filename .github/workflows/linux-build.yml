name: Build Linux Desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lib/**'
      - 'linux/**'
      - 'native/linux/**'
      - 'native/llama_cpp/**'
      - 'third_party/llama.cpp'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/linux-build.yml'
  push:
    branches:
      - main
      - 'platform/linux-desktop'
    paths:
      - 'lib/**'
      - 'linux/**'
      - 'native/linux/**'
      - 'native/llama_cpp/**'
      - 'third_party/llama.cpp'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/linux-build.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: linux-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev \
            libasound2-dev liblzma-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Show toolchain
        run: |
          flutter --version
          flutter doctor -v
          cmake --version
          clang --version
          uname -a

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart sources
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run Flutter tests
        run: |
          set -o pipefail
          flutter test --machine 2>&1 | tee flutter-test-results-linux.jsonl

      - name: Upload Flutter test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-results-linux
          path: flutter-test-results-linux.jsonl
          if-no-files-found: warn
          retention-days: 14

  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev \
            libasound2-dev liblzma-dev curl xvfb file binutils

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Build bundled llama.cpp runtime
        run: bash native/linux/build_llama_cli.sh

      - name: Smoke test real GGUF inference
        shell: bash
        env:
          TINY_GGUF_REVISION: def3e2dd70df35ecbf6403ea347de4c5977220c1
          TINY_GGUF_FILE: stories15M-q8_0.gguf
        run: |
          set -euo pipefail
          helper="$PWD/build/llama-linux/bin/llama-completion"
          smoke_dir="$RUNNER_TEMP/ai-orchestrator-linux-smoke"
          model="$smoke_dir/$TINY_GGUF_FILE"
          mkdir -p "$smoke_dir"

          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 20 --max-time 180 \
            --output "$model" \
            "https://huggingface.co/ggml-org/tiny-llamas/resolve/$TINY_GGUF_REVISION/$TINY_GGUF_FILE?download=true"

          test "$(stat -c '%s' "$model")" -gt 1000000
          test "$(head -c 4 "$model")" = "GGUF"

          output="$(timeout 120s "$helper" \
            -m "$model" -p 'The sky is' -n 8 \
            --temp 0 --top-p 1 --top-k 40 --repeat-penalty 1.0 \
            --no-conversation --no-display-prompt --verbosity 0)"
          test -n "$output"
          echo "GGUF_SMOKE_OK output_chars=${#output}"
          rm -f "$model"

      - name: Build Linux release
        run: flutter build linux --release

      - name: Embed and validate llama.cpp runtime
        shell: bash
        run: |
          set -euo pipefail
          bundle="$PWD/build/linux/x64/release/bundle"
          helper="$PWD/build/llama-linux/bin/llama-completion"
          test -x "$bundle/ai_orchestrator"
          test -d "$bundle/data/flutter_assets"
          install -m 0755 "$helper" "$bundle/llama-completion"
          install -m 0755 "$PWD/native/linux/llama-runtime" "$bundle/llama-runtime"

          cat > "$bundle/run-ai-orchestrator" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          bundle_dir="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export LLAMA_CPP_EXECUTABLE="${LLAMA_CPP_EXECUTABLE:-$bundle_dir/llama-runtime}"
          exec "$bundle_dir/ai_orchestrator" "$@"
          EOF
          chmod 0755 "$bundle/run-ai-orchestrator"

          test -x "$bundle/llama-runtime"
          test -x "$bundle/run-ai-orchestrator"
          bash -n "$bundle/llama-runtime"
          bash -n "$bundle/run-ai-orchestrator"
          grep -Fq 'LLAMA_CPP_EXECUTABLE' "$bundle/run-ai-orchestrator"
          grep -Fq 'llama-completion' "$bundle/llama-runtime"

          if ldd "$bundle/ai_orchestrator" | grep -F 'not found'; then
            echo 'Linux app has unresolved dynamic dependencies' >&2
            exit 1
          fi
          if ldd "$bundle/llama-completion" | grep -F 'not found'; then
            echo 'Bundled llama-completion has unresolved dynamic dependencies' >&2
            exit 1
          fi
          file "$bundle/ai_orchestrator" "$bundle/llama-completion"
          ldd "$bundle/ai_orchestrator"
          ldd "$bundle/llama-completion"

      - name: GUI launch smoke test
        shell: bash
        run: |
          set -euo pipefail
          bundle="$PWD/build/linux/x64/release/bundle"
          set +e
          xvfb-run -a timeout 12s "$bundle/run-ai-orchestrator" > linux-launch.log 2>&1
          status=$?
          set -e
          cat linux-launch.log
          if [[ $status -ne 124 ]]; then
            echo "Linux GUI exited unexpectedly with status $status" >&2
            exit 1
          fi
          echo 'LINUX_GUI_SMOKE_OK'

      - name: Package portable Linux bundle
        run: |
          set -euo pipefail
          mkdir -p build/linux/dist/AI-Orchestrator
          cp -a build/linux/x64/release/bundle/. build/linux/dist/AI-Orchestrator/
          test -x build/linux/dist/AI-Orchestrator/run-ai-orchestrator
          test -x build/linux/dist/AI-Orchestrator/llama-runtime
          tar -C build/linux/dist -czf ai-orchestrator-linux-x64.tar.gz AI-Orchestrator
          test -s ai-orchestrator-linux-x64.tar.gz
          sha256sum ai-orchestrator-linux-x64.tar.gz > ai-orchestrator-linux-x64.tar.gz.sha256

      - name: Build Debian installer
        run: bash linux/packaging/build_deb.sh

      - name: Validate Debian installer
        run: |
          set -euo pipefail
          deb="$(find build/linux/package -maxdepth 1 -name 'AI-Orchestrator_*_amd64.deb' -print -quit)"
          test -n "$deb"
          test -s "$deb"
          sha_file="$deb.sha256"
          test -s "$sha_file"
          (
            cd "$(dirname "$deb")"
            sha256sum -c "$(basename "$sha_file")"
          )
          if grep -Fq "$RUNNER_TEMP" "$sha_file" || grep -Fq "$GITHUB_WORKSPACE" "$sha_file"; then
            echo 'Debian checksum sidecar contains a runner-specific path' >&2
            cat "$sha_file" >&2
            exit 1
          fi
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | tee linux-deb-contents.log
          grep -F './usr/bin/ai-orchestrator' linux-deb-contents.log
          grep -F './usr/lib/ai-orchestrator/llama-completion' linux-deb-contents.log
          grep -F './usr/lib/ai-orchestrator/llama-runtime' linux-deb-contents.log

      - name: Upload Linux portable bundle
        uses: actions/upload-artifact@v4
        with:
          name: ai-orchestrator-linux-x64
          path: |
            ai-orchestrator-linux-x64.tar.gz
            ai-orchestrator-linux-x64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux Debian installer
        uses: actions/upload-artifact@v4
        with:
          name: ai-orchestrator-linux-deb-x64
          path: |
            build/linux/package/AI-Orchestrator_*_amd64.deb
            build/linux/package/AI-Orchestrator_*_amd64.deb.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux launch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-launch-diagnostics
          path: |
            linux-launch.log
            linux-deb-contents.log
          if-no-files-found: warn
          retention-days: 14

  validate-debian-compatibility:
    name: validate-deb-${{ matrix.os }}
    needs: build-linux
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Download exact Debian package from build job
        uses: actions/download-artifact@v4
        with:
          name: ai-orchestrator-linux-deb-x64
          path: linux-deb

      - name: Validate package dependency resolution
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find linux-deb -type f -name 'AI-Orchestrator_*_amd64.deb' -print -quit)"
          test -n "$deb"
          test -s "$deb"
          deb="$(realpath "$deb")"
          echo "Runner: ${{ matrix.os }}"
          echo "Package: $deb"
          dpkg-deb -f "$deb" Package Version Architecture Depends
          sudo apt-get update
          sudo apt-get install --simulate --no-install-recommends -y "$deb" | tee apt-install-simulate.log
          grep -Eq 'ai-orchestrator|AI Orchestrator' apt-install-simulate.log
          echo 'LINUX_DEB_DEPENDENCY_RESOLUTION_OK'
