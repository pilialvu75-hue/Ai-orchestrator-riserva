name: Windows 7 Legacy Flutter Engine

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: windows7-legacy-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-win7-legacy:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Flutter 3.22.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable
          cache: true

      - name: Show toolchain
        shell: pwsh
        run: flutter --version

      - name: Resolve dependencies
        shell: pwsh
        run: flutter pub get

      - name: Build Windows release with legacy engine
        shell: pwsh
        run: flutter build windows --release

      - name: Apply Windows 7 compatibility patches
        shell: pwsh
        run: |
          $releaseDir = Join-Path $PWD 'build\windows\x64\runner\Release'
          & (Join-Path $PWD 'tool\patch_windows_bundle_win7.ps1') -ReleaseDir $releaseDir

      - name: Create legacy portable candidate
        shell: pwsh
        run: |
          $releaseDir = Join-Path $PWD 'build\windows\x64\runner\Release'
          $zipPath = Join-Path $PWD 'AI-Orchestrator-Win7-Flutter-3.22.3-x64.zip'
          if (-not (Test-Path (Join-Path $releaseDir 'ai_orchestrator.exe'))) {
            throw 'Legacy Windows executable was not produced.'
          }
          Compress-Archive -Path (Join-Path $releaseDir '*') -DestinationPath $zipPath -CompressionLevel Optimal
          Get-FileHash -Path $zipPath -Algorithm SHA256

      - name: Upload legacy portable candidate
        uses: actions/upload-artifact@v4
        with:
          name: ai-orchestrator-win7-flutter-3.22.3-x64
          path: AI-Orchestrator-Win7-Flutter-3.22.3-x64.zip
          if-no-files-found: error
          retention-days: 14
