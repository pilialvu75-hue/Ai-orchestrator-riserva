name: Aivexus Web Fixed Counter Runner

on:
  workflow_dispatch:
    inputs:
      ticket:
        description: Opaque counter dispatch ticket
        required: true
        type: string
      public_key:
        description: RSA-OAEP public key in base64 SPKI format
        required: true
        type: string

permissions:
  contents: read

jobs:
  encrypted-counter:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate and test the fixed counter, then encrypt the ZIP
        env:
          AIVEXUS_COUNTER_TICKET: ${{ inputs.ticket }}
          AIVEXUS_COUNTER_PUBLIC_KEY: ${{ inputs.public_key }}
        run: node scripts/web/build_counter_runner_envelope.mjs "$RUNNER_TEMP/counter.aivexus"
      - name: Upload only the encrypted counter envelope
        uses: actions/upload-artifact@v4
        with:
          name: aivexus-counter-envelope
          path: ${{ runner.temp }}/counter.aivexus
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
