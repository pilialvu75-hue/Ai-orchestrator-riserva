name: Assistant Local Reliability Checks

on:
  push:
    branches:
      - codex/assistant-local-reliability
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: assistant-reliability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-windows:
    # Keep the Windows desktop toolchain deterministic. windows-latest moved to
    # VS2026, which turns permission_handler_windows' deprecated experimental
    # coroutine include into a hard compiler error.
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Show toolchain
        shell: pwsh
        run: |
          flutter --version
          flutter doctor -v

      - name: Resolve Flutter dependencies
        shell: pwsh
        run: flutter pub get --enforce-lockfile --enforce-lockfile

      - name: Analyze Dart sources
        shell: pwsh
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run Flutter tests
        id: flutter-tests
        shell: pwsh
        run: |
          flutter test test/core/tools/assistant_device_clock_test.dart test/core/tools/assistant_web_search_policy_test.dart test/core/orchestrator/assistant_web_aware_orchestrator_test.dart test/core/runtime/inference/assistant_web_continuation_local_runtime_provider_test.dart --machine 2>&1 | Tee-Object -FilePath flutter-test-results.jsonl
          $testExit = $LASTEXITCODE
          Write-Host "Flutter test exit code: $testExit"
          exit $testExit

      - name: Upload Flutter test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-results-windows
          path: flutter-test-results.jsonl
          if-no-files-found: warn
          retention-days: 14

