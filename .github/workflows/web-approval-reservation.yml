name: Aivexus Web Owned Approval Reservation Contract

on:
  pull_request:
    paths:
      - 'scripts/web/approved_execution_reservation.mjs'
      - 'scripts/web/d1_approval_reservation_store.mjs'
      - 'scripts/web/sql/001_web_approval_reservation.sql'
      - 'test/airlab/web_d1_approval_reservation.mjs'
      - 'test/airlab/web_d1_sqlite_contract_test.py'
      - 'test/airlab/web_approval_reservation.mjs'
      - '.github/workflows/web-approval-reservation.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/web/approved_execution_reservation.mjs'
      - 'scripts/web/d1_approval_reservation_store.mjs'
      - 'scripts/web/sql/001_web_approval_reservation.sql'
      - 'test/airlab/web_d1_approval_reservation.mjs'
      - 'test/airlab/web_d1_sqlite_contract_test.py'
      - 'test/airlab/web_approval_reservation.mjs'
      - '.github/workflows/web-approval-reservation.yml'

permissions:
  contents: read

jobs:
  approval-reservation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test trusted approval and concurrent idempotency
        run: |
          node --test test/airlab/web_approval_reservation.mjs
          node --test test/airlab/web_d1_approval_reservation.mjs
          python3 -m unittest discover -s test/airlab -p 'web_d1_sqlite_contract_test.py' -v
