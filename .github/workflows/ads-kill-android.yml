name: Ads Kill - Android beta
on:
  push:
    branches:
      - ads-kill/android-v0.1.8-stop-fix
    paths:
      - 'ads-kill/**'
      - '.github/workflows/ads-kill-android.yml'
  workflow_dispatch:

permissions:
  contents: write

# New pushes cancel older builds, preventing stale APKs overwriting the beta.
concurrency:
  group: ads-kill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK and install API 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: ads-kill/android
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify APK package, version and launcher icon
        working-directory: ads-kill/android
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")
          printf '%s\n' "$BADGING" | grep -F "package: name='dev.aivexus.adskill' versionCode='10' versionName='0.1.8-beta1'"
          printf '%s\n' "$BADGING" | grep -F "application-icon"
      - name: Verify VPN can be disabled by user
        run: |
          grep -F 'android.net.VpnService.SUPPORTS_ALWAYS_ON' ads-kill/android/app/src/main/AndroidManifest.xml
          grep -F 'android:value="false"' ads-kill/android/app/src/main/AndroidManifest.xml
          grep -F 'PREF_VPN_REQUESTED' ads-kill/android/app/src/main/java/dev/aivexus/adskill/AdsVpnService.java
          grep -F 'setAction(AdsVpnService.ACTION_STOP)' ads-kill/android/app/src/main/java/dev/aivexus/adskill/MainActivity.java
      - name: Build persistently signed release when dedicated Ads Kill key is configured
        id: signing
        working-directory: ads-kill/android
        shell: bash
        env:
          ADS_KILL_KEYSTORE_BASE64: ${{ secrets.ADS_KILL_KEYSTORE_BASE64 }}
          ADS_KILL_STORE_PASSWORD: ${{ secrets.ADS_KILL_STORE_PASSWORD }}
          ADS_KILL_KEY_ALIAS: ${{ secrets.ADS_KILL_KEY_ALIAS }}
          ADS_KILL_KEY_PASSWORD: ${{ secrets.ADS_KILL_KEY_PASSWORD }}
        run: |
          if [[ -z "$ADS_KILL_KEYSTORE_BASE64" || -z "$ADS_KILL_STORE_PASSWORD" || -z "$ADS_KILL_KEY_ALIAS" || -z "$ADS_KILL_KEY_PASSWORD" ]]; then
            echo 'No dedicated signing secrets configured; publish debug-only beta.'
            echo 'signed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          export ADS_KILL_KEYSTORE_PATH="$RUNNER_TEMP/ads-kill-signing.jks"
          umask 077
          printf '%s' "$ADS_KILL_KEYSTORE_BASE64" | base64 --decode > "$ADS_KILL_KEYSTORE_PATH"
          gradle --no-daemon --stacktrace assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk ../../ads-kill-v0.1.8-beta1-signed.apk
          echo 'signed=true' >> "$GITHUB_OUTPUT"
      - name: Rename APK
        run: cp ads-kill/android/app/build/outputs/apk/debug/app-debug.apk ads-kill-v0.1.8-beta1-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ads-Kill-Android-0.1.8-beta1
          path: |
            ads-kill-v0.1.8-beta1-debug.apk
            ads-kill-v0.1.8-beta1-signed.apk
          if-no-files-found: warn
          retention-days: 30
      - name: Publish first test prerelease
        if: github.ref == 'refs/heads/ads-kill/android-v0.1.8-stop-fix'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=ads-kill-v0.1.8-beta1
          assets=(ads-kill-v0.1.8-beta1-debug.apk)
          if [[ -f ads-kill-v0.1.8-beta1-signed.apk ]]; then
            assets+=(ads-kill-v0.1.8-beta1-signed.apk)
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "${assets[@]}" \
              --target "$GITHUB_SHA" --prerelease \
              --title "Ads Kill Android 0.1.8 beta1 (Samsung VPN stop fix)" \
              --notes "Samsung Galaxy S24 FE VPN shutdown fix: record explicit OFF request before stopping, send ACTION_STOP to tear down TUN, stopService fallback, disable unsupported Always-on VPN in beta, and add direct Android VPN settings link. Version 0.1.8 build 10, new launcher icon and manual beta checker retained. Debug build signing keys may differ across releases; uninstall may be necessary. Not yet device-tested."
          else
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --target "$GITHUB_SHA"
          fi
