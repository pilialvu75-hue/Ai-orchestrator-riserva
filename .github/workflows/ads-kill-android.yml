name: Ads Kill - Android beta
on:
  push:
    branches:
      - ads-kill/prototype-android
    paths:
      - 'ads-kill/**'
      - '.github/workflows/ads-kill-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: ads-kill/android
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Rename APK
        run: cp ads-kill/android/app/build/outputs/apk/debug/app-debug.apk ads-kill-v0.1.0-beta1-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ads-Kill-Android-0.1.0-beta1
          path: ads-kill-v0.1.0-beta1-debug.apk
          retention-days: 30
      - name: Publish first test prerelease
        if: github.ref == 'refs/heads/ads-kill/prototype-android'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=ads-kill-v0.1.0-beta1
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" ads-kill-v0.1.0-beta1-debug.apk \
              --target "$GITHUB_SHA" --prerelease \
              --title "Ads Kill Android 0.1.0 beta1 (test)" \
              --notes "Prototype for personal device testing only. Android DNS-only VPN; upstream Cloudflare DNS. Only 19 starter block rules. Not a general YouTube ad blocker. Debug signing key is ephemeral: future update may require uninstall."
          fi
