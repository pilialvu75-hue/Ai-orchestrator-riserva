name: temp-cantiere-2985-patch

on:
  push:
    branches:
      - cantiere/build-repair-oversized-target-2985
    paths:
      - .github/workflows/_temp_patch_cantiere_2985.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cantiere/build-repair-oversized-target-2985
          fetch-depth: 0
      - name: Apply bounded patch
        run: python3 .github/temp_patch_cantiere_2985.py
      - name: Commit patched files and remove temporary patch tooling
        shell: bash
        run: |
          git diff --check
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/app_factory/workshop/workshop_proposal_implementation_runner.dart test/app_factory/workshop/workshop_proposal_implementation_runner_test.dart
          git rm .github/temp_patch_cantiere_2985.py .github/workflows/_temp_patch_cantiere_2985.yml
          git commit -m 'fix(cantiere): read bounded oversized target during build repair'
          git push origin HEAD:cantiere/build-repair-oversized-target-2985
