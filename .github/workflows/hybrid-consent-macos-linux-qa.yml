name: HYBRID Consent macOS Linux QA

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/hybrid-consent-macos-linux-qa.yml'
      - 'lib/**'
      - 'test/**'
      - 'native/**'
      - 'macos/**'
      - 'linux/**'
      - 'pubspec.*'

permissions:
  contents: read

concurrency:
  group: hybrid-consent-macos-linux-qa-977
  cancel-in-progress: true

jobs:
  macos-hybrid-qa:
    if: >-
      github.event.pull_request.number == 977 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feat/hybrid-granular-cloud-consent-899'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Show toolchain
        run: |
          flutter --version
          xcodebuild -version
          cmake --version
          uname -m

      - name: Resolve Flutter dependencies
        run: flutter pub get --enforce-lockfile --enforce-lockfile

      - name: Verify HYBRID QA gate and consent routing
        run: >-
          flutter test
          --dart-define=AIVEXUS_EXPERIMENTAL_HYBRID_CONSENT_QA=true
          --dart-define=AIVEXUS_EXPECT_HYBRID_QA_ENABLED=true
          test/app/runtime_bootstrap_cloud_consent_flag_test.dart
          test/core/runtime/inference/hybrid_cloud_assistant_runtime_bundle_test.dart
          test/features/chat/data/repositories/chat_repository_gated_cloud_integration_test.dart
          test/features/settings/presentation/hybrid_cloud_consent_settings_page_test.dart

      - name: Validate versioned Xcode project
        run: xcodebuild -project macos/Runner.xcodeproj -list

      - name: Build bundled llama.cpp runtime
        run: bash native/macos/build_llama_cli.sh

      - name: Smoke test real GGUF inference
        shell: bash
        env:
          TINY_GGUF_REVISION: def3e2dd70df35ecbf6403ea347de4c5977220c1
          TINY_GGUF_FILE: stories15M-q8_0.gguf
        run: |
          set -euo pipefail

          helper="$PWD/build/llama-macos/bin/llama-completion"
          smoke_dir="$RUNNER_TEMP/ai-orchestrator-macos-smoke"
          model="$smoke_dir/$TINY_GGUF_FILE"
          mkdir -p "$smoke_dir"

          if [[ ! -x "$helper" ]]; then
            echo "llama-completion helper is missing: $helper" >&2
            exit 1
          fi

          model_url="https://huggingface.co/ggml-org/tiny-llamas/resolve/$TINY_GGUF_REVISION/$TINY_GGUF_FILE?download=true"
          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 20 --max-time 180 \
            --output "$model" "$model_url"

          model_bytes="$(stat -f '%z' "$model")"
          if (( model_bytes < 1000000 )); then
            echo "Downloaded GGUF is unexpectedly small: ${model_bytes} bytes" >&2
            exit 1
          fi

          header="$(dd if="$model" bs=1 count=4 2>/dev/null)"
          if [[ "$header" != "GGUF" ]]; then
            echo "Downloaded smoke model does not have a GGUF header" >&2
            exit 1
          fi

          HELPER="$helper" MODEL="$model" python3 - <<'PY'
          import os
          import subprocess
          import sys

          helper = os.environ["HELPER"]
          model = os.environ["MODEL"]
          cmd = [
              helper,
              "-m", model,
              "-p", "The sky is",
              "-n", "8",
              "--temp", "0",
              "--top-p", "1",
              "--top-k", "40",
              "--repeat-penalty", "1.0",
              "--no-conversation",
              "--no-display-prompt",
              "--verbosity", "0",
          ]

          try:
              completed = subprocess.run(
                  cmd,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
                  timeout=120,
                  check=False,
              )
          except subprocess.TimeoutExpired as exc:
              print("macOS llama.cpp smoke inference timed out after 120 seconds", file=sys.stderr)
              if exc.stdout:
                  print(exc.stdout, file=sys.stderr)
              if exc.stderr:
                  print(exc.stderr, file=sys.stderr)
              raise SystemExit(1)

          stdout = completed.stdout.strip()
          stderr = completed.stderr.strip()
          if completed.returncode != 0:
              print(f"llama-completion exited with {completed.returncode}", file=sys.stderr)
              if stdout:
                  print(f"stdout: {stdout}", file=sys.stderr)
              if stderr:
                  print(f"stderr: {stderr}", file=sys.stderr)
              raise SystemExit(1)

          if not stdout:
              print("llama-completion produced no stdout tokens", file=sys.stderr)
              if stderr:
                  print(f"stderr: {stderr}", file=sys.stderr)
              raise SystemExit(1)

          print(f"GGUF_SMOKE_OK output_chars={len(stdout)}")
          print(f"GGUF_SMOKE_SAMPLE={stdout[:160]!r}")
          PY

          rm -f "$model"

      - name: Build macOS release
        run: flutter build macos --release --dart-define=AIVEXUS_EXPERIMENTAL_HYBRID_CONSENT_QA=true

      - name: Embed and validate llama.cpp runtime
        id: runtime
        shell: bash
        run: |
          set -euo pipefail

          release_dir="$PWD/build/macos/Build/Products/Release"
          app_path="$(find "$release_dir" -maxdepth 1 -type d -name '*.app' -print -quit)"
          helper_source="$PWD/build/llama-macos/bin/llama-completion"
          helper_target="$app_path/Contents/MacOS/llama-completion"

          if [[ -z "$app_path" || ! -d "$app_path" ]]; then
            echo "No .app bundle found under $release_dir" >&2
            exit 1
          fi
          if [[ ! -x "$helper_source" ]]; then
            echo "Built llama-completion helper is missing: $helper_source" >&2
            exit 1
          fi

          install -m 0755 "$helper_source" "$helper_target"

          archs="$(lipo -archs "$helper_target")"
          if [[ "$archs" != *arm64* || "$archs" != *x86_64* ]]; then
            echo "Bundled llama-completion is not Universal 2: $archs" >&2
            exit 1
          fi

          dependencies="$(otool -L "$helper_target" | awk '/^\t/{print}')"
          if grep -Eq '/(opt/homebrew|usr/local|Users|private|Volumes)/' <<<"$dependencies"; then
            echo "Bundled llama-completion contains a non-portable dependency" >&2
            printf '%s\n' "$dependencies" >&2
            exit 1
          fi

          "$helper_target" --version

          codesign --force --sign - --timestamp=none "$helper_target"
          codesign --force --sign - --timestamp=none \
            --entitlements "$PWD/macos/Runner/Release.entitlements" \
            "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"

          echo "app_path=$app_path" >> "$GITHUB_OUTPUT"
          echo "helper_path=$helper_target" >> "$GITHUB_OUTPUT"
          echo "Bundled llama-completion architectures: $archs"

      - name: Validate and package app bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail

          app_path="${{ steps.runtime.outputs.app_path }}"
          helper_path="${{ steps.runtime.outputs.helper_path }}"

          if [[ -z "$app_path" || ! -d "$app_path" ]]; then
            echo "macOS app bundle output is missing" >&2
            exit 1
          fi
          if [[ ! -x "$helper_path" ]]; then
            echo "macOS app bundle is missing bundled llama-completion" >&2
            exit 1
          fi
          if [[ ! -f "$app_path/Contents/Info.plist" ]]; then
            echo "Generated app bundle is missing Contents/Info.plist" >&2
            exit 1
          fi

          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Contents/Info.plist")"
          if [[ -z "$executable_name" || ! -x "$app_path/Contents/MacOS/$executable_name" ]]; then
            echo "Generated app bundle is missing an executable entry point" >&2
            exit 1
          fi

          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Contents/Info.plist")"
          if [[ "$bundle_id" != "com.aiorchestrator" ]]; then
            echo "Unexpected macOS bundle identifier: $bundle_id" >&2
            exit 1
          fi

          if ! /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$app_path/Contents/Info.plist" >/dev/null; then
            echo "Generated app bundle is missing NSMicrophoneUsageDescription" >&2
            exit 1
          fi

          zip_path="$PWD/ai-orchestrator-macos.zip"
          rm -f "$zip_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$zip_path"

          if [[ ! -s "$zip_path" ]]; then
            echo "Generated macOS archive is empty" >&2
            exit 1
          fi

          echo "app_path=$app_path" >> "$GITHUB_OUTPUT"
          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"
          echo "Packaged $(basename "$app_path") -> $zip_path"

      - name: Inspect ad-hoc signed bundle
        run: |
          codesign -dvvv "${{ steps.bundle.outputs.app_path }}" 2>&1
          codesign -d --entitlements :- "${{ steps.bundle.outputs.app_path }}" 2>&1 || true
          otool -L "${{ steps.runtime.outputs.helper_path }}"
          spctl --assess --type execute --verbose=4 "${{ steps.bundle.outputs.app_path }}" 2>&1 || true

      - name: Verify archive and write QA instructions
        shell: bash
        run: |
          set -euo pipefail
          shasum -a 256 ai-orchestrator-macos.zip > ai-orchestrator-macos.zip.sha256
          cat > HYBRID-QA-README.txt <<'EOF'
          AIVEXUS HYBRID MACOS QA - NOT A RELEASE
          Cloud consent gate: ON; no provider credentials bundled.
          Use only a SEPARATE OS TEST ACCOUNT or a virtual machine.
          Portable files may share the installed app's databases and
          credentials when launched in the same operating system account.
          No release channel, update manifest or installed app was changed.
          EOF
      - name: Upload QA portable archive
        uses: actions/upload-artifact@v4
        with:
          name: AIVEXUS-HYBRID-macOS-QA-only
          path: |
            ai-orchestrator-macos.zip
            ai-orchestrator-macos.zip.sha256
            HYBRID-QA-README.txt
          retention-days: 7
          if-no-files-found: error

  linux-hybrid-qa:
    if: >-
      github.event.pull_request.number == 977 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feat/hybrid-granular-cloud-consent-899'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev \
            libasound2-dev liblzma-dev curl xvfb file binutils

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Resolve Flutter dependencies
        run: flutter pub get --enforce-lockfile --enforce-lockfile

      - name: Verify HYBRID QA gate and consent routing
        run: >-
          flutter test
          --dart-define=AIVEXUS_EXPERIMENTAL_HYBRID_CONSENT_QA=true
          --dart-define=AIVEXUS_EXPECT_HYBRID_QA_ENABLED=true
          test/app/runtime_bootstrap_cloud_consent_flag_test.dart
          test/core/runtime/inference/hybrid_cloud_assistant_runtime_bundle_test.dart
          test/features/chat/data/repositories/chat_repository_gated_cloud_integration_test.dart
          test/features/settings/presentation/hybrid_cloud_consent_settings_page_test.dart

      - name: Build bundled llama.cpp runtime
        run: bash native/linux/build_llama_cli.sh

      - name: Smoke test real GGUF inference
        shell: bash
        env:
          TINY_GGUF_REVISION: def3e2dd70df35ecbf6403ea347de4c5977220c1
          TINY_GGUF_FILE: stories15M-q8_0.gguf
        run: |
          set -euo pipefail
          helper="$PWD/build/llama-linux/bin/llama-completion"
          smoke_dir="$RUNNER_TEMP/ai-orchestrator-linux-smoke"
          model="$smoke_dir/$TINY_GGUF_FILE"
          mkdir -p "$smoke_dir"

          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 20 --max-time 180 \
            --output "$model" \
            "https://huggingface.co/ggml-org/tiny-llamas/resolve/$TINY_GGUF_REVISION/$TINY_GGUF_FILE?download=true"

          test "$(stat -c '%s' "$model")" -gt 1000000
          test "$(head -c 4 "$model")" = "GGUF"

          output="$(timeout 120s "$helper" \
            -m "$model" -p 'The sky is' -n 8 \
            --temp 0 --top-p 1 --top-k 40 --repeat-penalty 1.0 \
            --no-conversation --no-display-prompt --verbosity 0)"
          test -n "$output"
          echo "GGUF_SMOKE_OK output_chars=${#output}"
          rm -f "$model"

      - name: Build Linux release
        run: flutter build linux --release --dart-define=AIVEXUS_EXPERIMENTAL_HYBRID_CONSENT_QA=true

      - name: Embed and validate llama.cpp runtime
        shell: bash
        run: |
          set -euo pipefail
          bundle="$PWD/build/linux/x64/release/bundle"
          helper="$PWD/build/llama-linux/bin/llama-completion"
          test -x "$bundle/ai_orchestrator"
          test -d "$bundle/data/flutter_assets"
          install -m 0755 "$helper" "$bundle/llama-completion"
          install -m 0755 "$PWD/native/linux/llama-runtime" "$bundle/llama-runtime"

          cat > "$bundle/run-ai-orchestrator" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          bundle_dir="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export LLAMA_CPP_EXECUTABLE="${LLAMA_CPP_EXECUTABLE:-$bundle_dir/llama-runtime}"
          exec "$bundle_dir/ai_orchestrator" "$@"
          EOF
          chmod 0755 "$bundle/run-ai-orchestrator"

          test -x "$bundle/llama-runtime"
          test -x "$bundle/run-ai-orchestrator"
          bash -n "$bundle/llama-runtime"
          bash -n "$bundle/run-ai-orchestrator"
          grep -Fq 'LLAMA_CPP_EXECUTABLE' "$bundle/run-ai-orchestrator"
          grep -Fq 'llama-completion' "$bundle/llama-runtime"

          if ldd "$bundle/ai_orchestrator" | grep -F 'not found'; then
            echo 'Linux app has unresolved dynamic dependencies' >&2
            exit 1
          fi
          if ldd "$bundle/llama-completion" | grep -F 'not found'; then
            echo 'Bundled llama-completion has unresolved dynamic dependencies' >&2
            exit 1
          fi
          file "$bundle/ai_orchestrator" "$bundle/llama-completion"
          ldd "$bundle/ai_orchestrator"
          ldd "$bundle/llama-completion"

      - name: GUI launch smoke test
        shell: bash
        run: |
          set -euo pipefail
          bundle="$PWD/build/linux/x64/release/bundle"
          set +e
          xvfb-run -a timeout 12s "$bundle/run-ai-orchestrator" > linux-launch.log 2>&1
          status=$?
          set -e
          cat linux-launch.log
          if [[ $status -ne 124 ]]; then
            echo "Linux GUI exited unexpectedly with status $status" >&2
            exit 1
          fi
          echo 'LINUX_GUI_SMOKE_OK'

      - name: Package portable Linux bundle
        run: |
          set -euo pipefail
          mkdir -p build/linux/dist/AI-Orchestrator
          cp -a build/linux/x64/release/bundle/. build/linux/dist/AI-Orchestrator/
          test -x build/linux/dist/AI-Orchestrator/run-ai-orchestrator
          test -x build/linux/dist/AI-Orchestrator/llama-runtime
          tar -C build/linux/dist -czf ai-orchestrator-linux-x64.tar.gz AI-Orchestrator
          test -s ai-orchestrator-linux-x64.tar.gz
          sha256sum ai-orchestrator-linux-x64.tar.gz > ai-orchestrator-linux-x64.tar.gz.sha256

      - name: Verify archive and write QA instructions
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c ai-orchestrator-linux-x64.tar.gz.sha256
          cat > HYBRID-QA-README.txt <<'EOF'
          AIVEXUS HYBRID LINUX QA - NOT A RELEASE
          Cloud consent gate: ON; no provider credentials bundled.
          Use only a SEPARATE OS TEST ACCOUNT or a virtual machine.
          Portable files may share the installed app's databases and
          credentials when launched in the same operating system account.
          No release channel, update manifest or installed app was changed.
          EOF
      - name: Upload QA portable archive
        uses: actions/upload-artifact@v4
        with:
          name: AIVEXUS-HYBRID-Linux-QA-only
          path: |
            ai-orchestrator-linux-x64.tar.gz
            ai-orchestrator-linux-x64.tar.gz.sha256
            HYBRID-QA-README.txt
          retention-days: 7
          if-no-files-found: error
