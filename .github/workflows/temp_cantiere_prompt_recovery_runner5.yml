name: temp-cantiere-prompt-recovery-runner5
on: push
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cantiere/project-delete-and-prompt-crash-hardening
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Apply source hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          script = Path('.github/scripts/temp_cantiere_prompt_recovery.py')
          text = script.read_text()
          old = '${selectedProject.title}'
          new = '${selectedProject!.title}'
          if text.count(old) != 1:
              raise SystemExit(f'nullable delete anchor count={text.count(old)}')
          script.write_text(text.replace(old, new, 1))
          PY
          python3 .github/scripts/temp_cantiere_prompt_recovery.py
          python3 - <<'PY'
          from pathlib import Path
          page = Path('lib/app_factory/workshop/workshop_dashboard_page.dart')
          text = page.read_text()
          old = '''    _chatController.clearConversation();
    _addWelcomeMessage();

    _messageController.clear();

    _showMessage(
      'Nuova conversazione del Cantiere.',
    );
'''
          new = '''    await widget._clearPendingPrompt?.call();

    _chatController.clearConversation();
    _addWelcomeMessage();

    _messageController.clear();

    _showMessage(
      'Nuova conversazione del Cantiere.',
    );
'''
          if text.count(old) != 1:
              raise SystemExit(f'new conversation anchor count={text.count(old)}')
          page.write_text(text.replace(old, new, 1))
          PY
      - name: Format
        run: dart format lib/app_factory/workshop/workshop_pending_prompt_draft.dart lib/app_factory/workshop/workshop_production_recovery_coordinator.dart lib/app_factory/workshop/workshop_dashboard_page.dart lib/app_factory/workshop/workshop_production_dashboard_page.dart
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze touched source
        run: flutter analyze --no-fatal-infos lib/app_factory/workshop/workshop_pending_prompt_draft.dart lib/app_factory/workshop/workshop_production_recovery_coordinator.dart lib/app_factory/workshop/workshop_dashboard_page.dart lib/app_factory/workshop/workshop_production_dashboard_page.dart
      - name: Run focused regressions
        run: flutter test test/app_factory/workshop/workshop_dashboard_page_lifecycle_test.dart test/app_factory/workshop/workshop_production_recovery_coordinator_test.dart
      - name: Commit clean source diff
        shell: bash
        run: |
          git checkout -- analysis_options.yaml pubspec.lock || true
          git diff --check
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/app_factory/workshop/workshop_pending_prompt_draft.dart lib/app_factory/workshop/workshop_production_recovery_coordinator.dart lib/app_factory/workshop/workshop_dashboard_page.dart lib/app_factory/workshop/workshop_production_dashboard_page.dart
          git rm .github/scripts/temp_cantiere_prompt_recovery.py .github/workflows/temp_cantiere_prompt_recovery.yml .github/workflows/temp_cantiere_prompt_recovery_runner.yml .github/workflows/temp_cantiere_prompt_recovery_runner2.yml .github/workflows/temp_cantiere_prompt_recovery_runner3.yml .github/workflows/temp_cantiere_prompt_recovery_runner4.yml .github/workflows/temp_cantiere_prompt_recovery_runner5.yml .github/workflows/temp_cantiere_prompt_recovery_runner6.yml
          git commit -m 'fix(cantiere): persist fresh prompts and expose project deletion'
          git push origin HEAD:cantiere/project-delete-and-prompt-crash-hardening
