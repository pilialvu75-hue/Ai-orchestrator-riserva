name: Analyzer Info Cleanup Experiment

on:
  push:
    branches:
      - codex/flutter-analyze-info-cleanup
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: analyzer-info-cleanup-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  cleanup:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[analyzer-cleanup]')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v6
        with:
          ref: codex/flutter-analyze-info-cleanup
          fetch-depth: 0
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies without keeping SDK housekeeping changes
        run: |
          set -euo pipefail
          flutter pub get
          # Flutter 3.47 may rewrite analysis_options.yaml as SDK housekeeping.
          # That is unrelated to this lint-only experiment, so keep the branch
          # configuration byte-for-byte unchanged.
          git restore --worktree analysis_options.yaml

      - name: Apply only behavior-preserving analyzer info quick-fixes
        run: |
          set -euo pipefail

          # Only codes whose current Dart quick-fixes were verified not to
          # introduce analyzer errors in the first experiment are included.
          # deprecated_member_use is intentionally excluded: its generated
          # ListView migration produced an undefined ScrollCacheExtent symbol.
          codes=(
            always_use_package_imports
            prefer_const_constructors
            prefer_conditional_assignment
            prefer_initializing_formals
            prefer_const_declarations
            use_super_parameters
            no_leading_underscores_for_local_identifiers
            unnecessary_const
          )

          for code in "${codes[@]}"; do
            echo "== dart fix: $code =="
            dart fix --apply --code="$code"
          done

      - name: Show code diff
        run: git diff --check && git diff --stat && git diff

      - name: Verify Flutter analyzer
        run: |
          set -o pipefail
          flutter analyze --no-fatal-warnings --no-fatal-infos 2>&1 | tee /tmp/flutter-analyze.txt

          if grep -Eq '^[[:space:]]*info[[:space:]]+•' /tmp/flutter-analyze.txt; then
            echo '::warning::Analyzer INFO diagnostics remain for manual review.'
          else
            echo 'No analyzer INFO diagnostics remain.'
          fi

      - name: Run regression tests
        run: flutter test

      - name: Commit verified cleanup
        run: |
          set -euo pipefail

          # Never absorb dependency/configuration housekeeping into this patch.
          git restore --worktree analysis_options.yaml pubspec.lock || true

          if git diff --quiet -- lib test; then
            echo 'No source/test changes to commit.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib test

          if git diff --cached --quiet; then
            echo 'No lib/test changes to commit.'
            exit 0
          fi

          git commit -m 'chore: apply safe analyzer info fixes [analyzer-cleanup]'
          git push origin HEAD:codex/flutter-analyze-info-cleanup

# rerun analyzer after safe-fix commit
