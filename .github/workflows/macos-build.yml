name: Build macOS Desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lib/**'
      - 'macos/**'
      - 'native/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/macos-build.yml'
  push:
    branches:
      - main
      - 'platform/macos-local-runtime'
      - 'platform/macos-runtime-smoke'
      - 'platform/macos-distribution'
    paths:
      - 'lib/**'
      - 'macos/**'
      - 'native/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/macos-build.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: macos-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Show toolchain
        run: |
          flutter --version
          xcodebuild -version
          cmake --version
          uname -m

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart sources
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run Flutter tests
        run: |
          set -o pipefail
          flutter test --machine 2>&1 | tee flutter-test-results-macos.jsonl

      - name: Upload Flutter test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-results-macos
          path: flutter-test-results-macos.jsonl
          if-no-files-found: warn
          retention-days: 14

  build-macos:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Show toolchain
        run: |
          flutter --version
          xcodebuild -version
          cmake --version
          uname -m

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Validate versioned Xcode project
        run: xcodebuild -project macos/Runner.xcodeproj -list

      - name: Build bundled llama.cpp runtime
        run: bash native/macos/build_llama_cli.sh

      - name: Smoke test real GGUF inference
        shell: bash
        env:
          TINY_GGUF_REVISION: def3e2dd70df35ecbf6403ea347de4c5977220c1
          TINY_GGUF_FILE: stories15M-q8_0.gguf
        run: |
          set -euo pipefail

          helper="$PWD/build/llama-macos/bin/llama-completion"
          smoke_dir="$RUNNER_TEMP/ai-orchestrator-macos-smoke"
          model="$smoke_dir/$TINY_GGUF_FILE"
          mkdir -p "$smoke_dir"

          if [[ ! -x "$helper" ]]; then
            echo "llama-completion helper is missing: $helper" >&2
            exit 1
          fi

          model_url="https://huggingface.co/ggml-org/tiny-llamas/resolve/$TINY_GGUF_REVISION/$TINY_GGUF_FILE?download=true"
          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 20 --max-time 180 \
            --output "$model" "$model_url"

          model_bytes="$(stat -f '%z' "$model")"
          if (( model_bytes < 1000000 )); then
            echo "Downloaded GGUF is unexpectedly small: ${model_bytes} bytes" >&2
            exit 1
          fi

          header="$(dd if="$model" bs=1 count=4 2>/dev/null)"
          if [[ "$header" != "GGUF" ]]; then
            echo "Downloaded smoke model does not have a GGUF header" >&2
            exit 1
          fi

          HELPER="$helper" MODEL="$model" python3 - <<'PY'
          import os
          import subprocess
          import sys

          helper = os.environ["HELPER"]
          model = os.environ["MODEL"]
          cmd = [
              helper,
              "-m", model,
              "-p", "The sky is",
              "-n", "8",
              "--temp", "0",
              "--top-p", "1",
              "--top-k", "40",
              "--repeat-penalty", "1.0",
              "--no-conversation",
              "--no-display-prompt",
              "--verbosity", "0",
          ]

          try:
              completed = subprocess.run(
                  cmd,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
                  timeout=120,
                  check=False,
              )
          except subprocess.TimeoutExpired as exc:
              print("macOS llama.cpp smoke inference timed out after 120 seconds", file=sys.stderr)
              if exc.stdout:
                  print(exc.stdout, file=sys.stderr)
              if exc.stderr:
                  print(exc.stderr, file=sys.stderr)
              raise SystemExit(1)

          stdout = completed.stdout.strip()
          stderr = completed.stderr.strip()
          if completed.returncode != 0:
              print(f"llama-completion exited with {completed.returncode}", file=sys.stderr)
              if stdout:
                  print(f"stdout: {stdout}", file=sys.stderr)
              if stderr:
                  print(f"stderr: {stderr}", file=sys.stderr)
              raise SystemExit(1)

          if not stdout:
              print("llama-completion produced no stdout tokens", file=sys.stderr)
              if stderr:
                  print(f"stderr: {stderr}", file=sys.stderr)
              raise SystemExit(1)

          print(f"GGUF_SMOKE_OK output_chars={len(stdout)}")
          print(f"GGUF_SMOKE_SAMPLE={stdout[:160]!r}")
          PY

          rm -f "$model"

      - name: Build macOS release
        run: flutter build macos --release

      - name: Embed and validate llama.cpp runtime
        id: runtime
        shell: bash
        run: |
          set -euo pipefail

          release_dir="$PWD/build/macos/Build/Products/Release"
          app_path="$(find "$release_dir" -maxdepth 1 -type d -name '*.app' -print -quit)"
          helper_source="$PWD/build/llama-macos/bin/llama-completion"
          helper_target="$app_path/Contents/MacOS/llama-completion"

          if [[ -z "$app_path" || ! -d "$app_path" ]]; then
            echo "No .app bundle found under $release_dir" >&2
            exit 1
          fi
          if [[ ! -x "$helper_source" ]]; then
            echo "Built llama-completion helper is missing: $helper_source" >&2
            exit 1
          fi

          install -m 0755 "$helper_source" "$helper_target"

          archs="$(lipo -archs "$helper_target")"
          if [[ "$archs" != *arm64* || "$archs" != *x86_64* ]]; then
            echo "Bundled llama-completion is not Universal 2: $archs" >&2
            exit 1
          fi

          dependencies="$(otool -L "$helper_target" | awk '/^\t/{print}')"
          if grep -Eq '/(opt/homebrew|usr/local|Users|private|Volumes)/' <<<"$dependencies"; then
            echo "Bundled llama-completion contains a non-portable dependency" >&2
            printf '%s\n' "$dependencies" >&2
            exit 1
          fi

          "$helper_target" --version

          codesign --force --sign - --timestamp=none "$helper_target"
          codesign --force --sign - --timestamp=none \
            --entitlements "$PWD/macos/Runner/Release.entitlements" \
            "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"

          echo "app_path=$app_path" >> "$GITHUB_OUTPUT"
          echo "helper_path=$helper_target" >> "$GITHUB_OUTPUT"
          echo "Bundled llama-completion architectures: $archs"

      - name: Validate and package app bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail

          app_path="${{ steps.runtime.outputs.app_path }}"
          helper_path="${{ steps.runtime.outputs.helper_path }}"

          if [[ -z "$app_path" || ! -d "$app_path" ]]; then
            echo "macOS app bundle output is missing" >&2
            exit 1
          fi
          if [[ ! -x "$helper_path" ]]; then
            echo "macOS app bundle is missing bundled llama-completion" >&2
            exit 1
          fi
          if [[ ! -f "$app_path/Contents/Info.plist" ]]; then
            echo "Generated app bundle is missing Contents/Info.plist" >&2
            exit 1
          fi

          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Contents/Info.plist")"
          if [[ -z "$executable_name" || ! -x "$app_path/Contents/MacOS/$executable_name" ]]; then
            echo "Generated app bundle is missing an executable entry point" >&2
            exit 1
          fi

          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Contents/Info.plist")"
          if [[ "$bundle_id" != "com.aiorchestrator" ]]; then
            echo "Unexpected macOS bundle identifier: $bundle_id" >&2
            exit 1
          fi

          if ! /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$app_path/Contents/Info.plist" >/dev/null; then
            echo "Generated app bundle is missing NSMicrophoneUsageDescription" >&2
            exit 1
          fi

          zip_path="$PWD/ai-orchestrator-macos.zip"
          rm -f "$zip_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$zip_path"

          if [[ ! -s "$zip_path" ]]; then
            echo "Generated macOS archive is empty" >&2
            exit 1
          fi

          echo "app_path=$app_path" >> "$GITHUB_OUTPUT"
          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"
          echo "Packaged $(basename "$app_path") -> $zip_path"

      - name: Inspect ad-hoc signed bundle
        run: |
          codesign -dvvv "${{ steps.bundle.outputs.app_path }}" 2>&1
          codesign -d --entitlements :- "${{ steps.bundle.outputs.app_path }}" 2>&1 || true
          otool -L "${{ steps.runtime.outputs.helper_path }}"
          spctl --assess --type execute --verbose=4 "${{ steps.bundle.outputs.app_path }}" 2>&1 || true

      - name: Create and verify macOS DMG
        id: dmg
        shell: bash
        run: |
          set -euo pipefail

          dmg_path="$PWD/AI-Orchestrator-macOS.dmg"
          bash native/macos/package_dmg.sh \
            "${{ steps.bundle.outputs.app_path }}" \
            "$dmg_path"

          if [[ ! -s "$dmg_path" || ! -s "$dmg_path.sha256" ]]; then
            echo "DMG packager did not produce the expected files" >&2
            exit 1
          fi

          dmg_size="$(stat -f '%z' "$dmg_path")"
          dmg_sha256="$(shasum -a 256 "$dmg_path" | awk '{print tolower($1)}')"
          expected_sha256="$(awk '{print tolower($1)}' "$dmg_path.sha256")"
          if [[ "$dmg_sha256" != "$expected_sha256" ]]; then
            echo "DMG SHA-256 sidecar does not match generated image" >&2
            exit 1
          fi

          echo "dmg_path=$dmg_path" >> "$GITHUB_OUTPUT"
          echo "dmg_sha256_path=$dmg_path.sha256" >> "$GITHUB_OUTPUT"
          echo "dmg_size=$dmg_size" >> "$GITHUB_OUTPUT"
          echo "dmg_sha256=$dmg_sha256" >> "$GITHUB_OUTPUT"
          echo "DMG verified: $dmg_path ($dmg_size bytes) sha256=$dmg_sha256"

      - name: Upload macOS app bundle
        uses: actions/upload-artifact@v4
        with:
          name: ai-orchestrator-macos
          path: ai-orchestrator-macos.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: ai-orchestrator-macos-dmg
          path: |
            ${{ steps.dmg.outputs.dmg_path }}
            ${{ steps.dmg.outputs.dmg_sha256_path }}
          if-no-files-found: error
          retention-days: 14
