name: Verify and repair Windows asset for an authorized beta

# Deliberate, auditable request file: no publication from arbitrary main pushes.
on:
  push:
    branches:
      - release-request/windows
    paths:
      - 'release-requests/ship-windows.txt'
      - '.github/workflows/windows-beta-recovery.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/windows-beta-recovery.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: aivexus-windows-recovery
  cancel-in-progress: false

jobs:
  verify-recovery-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Verify strictly scoped Windows recovery source
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'release-request/windows' .github/workflows/windows-beta-recovery.yml
          grep -Fq 'workflow_dispatch' .github/workflows/windows-beta-recovery.yml
          grep -Fq 'source_run' .github/workflows/windows-beta-recovery.yml
          grep -Fq 'tag_sha' .github/workflows/windows-beta-recovery.yml
          grep -Fq 'windows-release-publish.yml' .github/workflows/windows-beta-recovery.yml

  dispatch-provenanced-windows-recovery:
    if: github.event_name == 'push' && github.repository == 'pilialvu75-hue/Ai-orchestrator-riserva'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify explicit request, successful authorized Android run and published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          request='release-requests/ship-windows.txt'
          test -f "$request"
          test "$(wc -l < "$request")" -eq 3
          run_id="$(sed -n 's/^android_run_id=//p' "$request")"
          sha="$(sed -n 's/^source_sha=//p' "$request")"
          tag="$(sed -n 's/^tag=//p' "$request")"
          [[ "$run_id" =~ ^[0-9]{6,16}$ ]]
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(beta|nightly|dev)\+[0-9]+$ ]]
          grep -Fxq "android_run_id=$run_id" "$request"
          grep -Fxq "source_sha=$sha" "$request"
          grep -Fxq "tag=$tag" "$request"

          echo "Verified strict recovery request syntax"
          source_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
          jq -e --arg sha "$sha" --arg repo "$GITHUB_REPOSITORY" '
            .name == "Build & Release APK" and
            .event == "workflow_dispatch" and
            .head_branch == "main" and
            .status == "completed" and
            .conclusion == "success" and
            .head_sha == $sha and
            .repository.full_name == $repo
          ' <<<"$source_run" >/dev/null

          echo "Authorized Android workflow_dispatch success confirmed"
          source_run_number="$(jq -r '.run_number' <<<"$source_run")"
          [[ "$source_run_number" =~ ^[0-9]+$ ]]
          version_code="$((100000 + source_run_number))"
          echo "Authorized Android build=$version_code, requested release tag=$tag"
          [[ "$tag" == *"+$version_code" ]] || {
            echo "::error::Tag does not match the authorized Android run build number"
            exit 1
          }
          echo "Version code matches requested beta tag"
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')"
          test "$tag_sha" = "$sha"

          echo "Release tag points to the authorized Android commit"
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
          jq -e --arg tag "$tag" '
            .tag_name == $tag and .draft == false and .prerelease == true and
            ([.assets[].name] | index("app-release.apk") != null)
          ' <<<"$release" >/dev/null
          echo "Published beta and Android APK verified"
          if jq -e '[.assets[].name] | index("AI-Orchestrator-Setup-x64.exe") != null' \
              <<<"$release" >/dev/null; then
            echo "::notice::Windows installer already present in authorized release $tag"
            exit 0
          fi
          gh workflow run windows-release-publish.yml \
            --repo "$GITHUB_REPOSITORY" --ref main -f android_run_id="$run_id"
          echo "Verified Windows recovery dispatched for existing $tag (run $run_id)"
