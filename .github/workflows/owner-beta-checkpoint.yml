name: Owner-authorized Aivexus beta checkpoint

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    branches: [main]
    paths:
      - '.github/workflows/owner-beta-checkpoint.yml'
      - 'scripts/check_owner_beta_checkpoint.py'
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  actions: write

concurrency:
  group: aivexus-owner-beta-checkpoint
  cancel-in-progress: false

jobs:
  contract:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Verify trusted checkpoint and existing release gates
        run: |
          python3 scripts/check_owner_beta_checkpoint.py .github/workflows/owner-beta-checkpoint.yml
          python3 scripts/check_android_release_gate.py \
            .github/workflows/build.yml \
            .github/workflows/macos-release-publish.yml \
            .github/workflows/linux-release-publish.yml \
            .github/workflows/windows-release-publish.yml

  authorize-and-dispatch:
    # Authorized channels:
    # - owner request in dedicated issue #1008 (normal recurring checkpoints)
    # - explicitly marked checkpoint PR merged by the repository owner.
    #   This also bootstraps the first fully automatic release.
    if: >-
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 1008 &&
       github.event.issue.pull_request == null &&
       github.event.issue.state == 'open' &&
       github.actor == github.repository_owner &&
       github.event.issue.user.login == github.repository_owner &&
       github.event.comment.user.login == github.repository_owner &&
       startsWith(github.event.comment.body, '/aivexus beta-checkpoint ')) ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'closed' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.user.login == github.repository_owner &&
       github.actor == github.repository_owner &&
       contains(github.event.pull_request.title, '[beta-checkpoint]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Authenticate checkpoint, verify main and wait for green source CI
        shell: bash
        run: |
          set -euo pipefail
          command -v gh
          command -v jq

          # No untrusted issue or PR text is ever run as shell code.
          if [[ "$GITHUB_EVENT_NAME" == "issue_comment" ]]; then
            request="$(jq -r '.comment.body // ""' "$GITHUB_EVENT_PATH")"
            if [[ ! "$request" =~ ^/aivexus[[:space:]]beta-checkpoint[[:space:]]([0-9a-f]{40})$ ]]; then
              echo "::error::Invalid exact checkpoint command"
              exit 1
            fi
            sha="$(echo "$request" | awk '{print $3}')"
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            sha="$(jq -r '.pull_request.merge_commit_sha // ""' "$GITHUB_EVENT_PATH")"
            if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Invalid merged checkpoint SHA"
              exit 1
            fi
          else
            echo "::error::Unexpected triggering event"
            exit 1
          fi
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
          if [[ "$sha" != "$main_sha" ]]; then
            echo "::error::Checkpoint commit is not the current main head"
            exit 1
          fi

          # Idempotence: a checkpoint already dispatched for this exact
          # source SHA cannot be silently republished with a new build code.
          prior="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/runs" \
            -f head_sha="$sha" -f event=workflow_dispatch -f per_page=100)"
          if jq -e '[.workflow_runs[] |
            select(.name == "Build & Release APK")] | length > 0' \
            <<<"$prior" >/dev/null; then
            echo "::notice::Android release already requested for this source SHA"
            exit 0
          fi

          # Do not release merely because a PR was merged. The mandatory
          # post-merge source CI must pass on main before dispatching Android.
          required=(
            "Assistant Shared Tests"
            "Web Cantiere Build"
            "Build Linux Desktop"
            "Build Windows Desktop"
            "Build macOS Desktop"
          )
          for attempt in $(seq 1 90); do
            current="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
            if [[ "$current" != "$sha" ]]; then
              echo "::error::main changed while checkpoint was waiting"
              exit 1
            fi
            runs="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/runs" \
              -f head_sha="$sha" -f event=push -f per_page=100)"
            pending=0
            for name in "${required[@]}"; do
              state="$(jq -r --arg name "$name" --arg sha "$sha" '
                [.workflow_runs[] |
                 select(.name == $name and .head_sha == $sha
                        and .event == "push")]
                | sort_by(.id) | last | (.conclusion // "pending")
              ' <<<"$runs")"
              case "$state" in
                success) echo "PASS main CI: $name";;
                pending|"") pending=1; echo "WAIT main CI: $name";;
                *) echo "::error::main CI $name concluded $state";
                   exit 1;;
              esac
            done
            if [[ "$pending" -eq 0 ]]; then
              echo "All mandatory main CI workflows completed successfully"
              # The existing manual-dispatch release gate is deliberately
              # preserved; this trusted owner request generates that event.
              # Dispatches made with GITHUB_TOKEN do NOT emit workflow_run
              # events for dependent workflows. Explicitly bridge the verified
              # Android run to the Windows publisher after success instead.
              gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref main -f release_channel=beta
              echo "Authorized beta dispatch requested for main SHA $sha"
              release_run_id=""
              for release_attempt in $(seq 1 80); do
                main_now="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
                if [[ "$main_now" != "$sha" ]]; then
                  echo "::error::main changed during Android release"
                  exit 1
                fi
                release_runs="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/runs" \
                  -f head_sha="$sha" -f event=workflow_dispatch -f per_page=30)"
                release_run_id="$(jq -r --arg sha "$sha" '
                  [.workflow_runs[] |
                    select(.name == "Build & Release APK" and
                           .head_sha == $sha and
                           .event == "workflow_dispatch")] |
                  sort_by(.id) | last | (.id // empty)
                ' <<<"$release_runs")"
                if [[ -n "$release_run_id" ]]; then
                  release_state="$(jq -r --argjson id "$release_run_id" '
                    .workflow_runs[] | select(.id == $id) |
                    (.conclusion // "pending")
                  ' <<<"$release_runs")"
                  if [[ "$release_state" == "success" ]]; then
                    break
                  fi
                  if [[ "$release_state" != "pending" ]]; then
                    echo "::error::Android release $release_run_id concluded $release_state"
                    exit 1
                  fi
                fi
                sleep 30
              done
              if [[ -z "$release_run_id" || "$release_state" != "success" ]]; then
                echo "::error::Timed out waiting for the authorized Android release"
                exit 1
              fi
              # The publisher independently verifies workflow completion,
              # exact source SHA, release tag, version and authorized channel.
              gh workflow run windows-release-publish.yml \
                --repo "$GITHUB_REPOSITORY" --ref main \
                -f android_run_id="$release_run_id"
              echo "Windows publisher explicitly dispatched for authorized Android run $release_run_id"
              exit 0
            fi
            sleep 45
          done
          echo "::error::Checkpoint timed out waiting for mandatory main CI"
          exit 1
