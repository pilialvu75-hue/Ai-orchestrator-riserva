name: temp-cantiere-prompt-recovery-runner
on: push
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cantiere/project-delete-and-prompt-crash-hardening
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Execute patch payload
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/temp_cantiere_prompt_recovery.yml')
          lines = p.read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == 'run: |') + 1
          payload = []
          for line in lines[start:]:
              if line.startswith('          '):
                  payload.append(line[10:])
              elif line.strip():
                  break
          script = '\n'.join(payload) + '\n'
          script = script.replace(
              'git rm .github/workflows/temp_cantiere_prompt_recovery.yml',
              'git rm .github/workflows/temp_cantiere_prompt_recovery.yml .github/workflows/temp_cantiere_prompt_recovery_runner.yml',
          )
          Path('/tmp/cantiere-prompt-recovery.sh').write_text(script)
          PY
          bash -euxo pipefail /tmp/cantiere-prompt-recovery.sh
